<style>:root{--bg:#F3F5FA;--sf:#fff;--ink:#14203D;--mut:#5F6B85;--line:#DCE1EC;--line2:#EDF0F6;--pri:#2448D8;--pri-d:#1A36AE;--pri-s:#E6EBFF;--ok:#0F8A5F;--ok-s:#E3F5EC;--bad:#C23A2B;--bad-s:#FBE7E4;--warn:#9A5D00;--warn-s:#FFF2D9;--hl:#FFD84D;--nav:#14203D;--r:10px;--rs:6px;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:15px/1.5 Archivo,"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.01em}h1{font-size:26px;font-weight:800}h2{font-size:18px;font-weight:700}h3{font-size:15px;font-weight:700}
a{color:var(--pri)}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.hidden{display:none!important}.sp{flex:1}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.end{justify-content:flex-end}
.hint{color:var(--mut);font-size:13.5px}.note{color:var(--mut);font-size:13px;margin:12px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:var(--rs);padding:9px 16px;font-weight:600;cursor:pointer;text-decoration:none;min-height:40px;white-space:nowrap}
.btn:hover{background:var(--pri-d)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:var(--sf);color:var(--ink);border-color:var(--line)}.btn.sec:hover{border-color:var(--ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--pri)}.btn.ghost:hover{background:var(--pri-s)}
.btn.ok{background:var(--ok);border-color:var(--ok)}.btn.bad{background:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13.5px}
.inp{width:100%;border:1px solid var(--line);border-radius:var(--rs);padding:9px 11px;background:var(--sf);min-height:40px}
.inp:focus{border-color:var(--pri);outline:none;box-shadow:0 0 0 3px var(--pri-s)}textarea.inp{min-height:90px;resize:vertical}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.fld>label,.lbl{font-weight:600;font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0 16px}.full{grid-column:1/-1}
.panel{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;background:var(--line2);color:var(--mut);white-space:nowrap}
.pill.ok{background:var(--ok-s);color:var(--ok)}.pill.bad{background:var(--bad-s);color:var(--bad)}.pill.warn{background:var(--warn-s);color:var(--warn)}.pill.pri{background:var(--pri-s);color:var(--pri)}
.list{list-style:none;margin:0;padding:0}.list li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line2)}.list li:last-child{border-bottom:0}
.list .t{flex:1;min-width:0}.list .t>div:last-child:not(:first-child){color:var(--mut);font-size:13.5px}.link{cursor:pointer}.link:hover{background:var(--bg)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--sf)}table{width:100%;border-collapse:collapse}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line2);font-size:14px;vertical-align:top}th{font-size:13px;color:var(--mut);font-weight:600;background:#FAFBFD}td.n,th.n{text-align:right}
.empty{text-align:center;color:var(--mut);padding:34px 16px}.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}.tabs button.on{color:var(--ink);border-bottom-color:var(--pri)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.kpi{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}.kpi b{display:block;font-size:28px;font-weight:800;line-height:1.1}.kpi span{color:var(--mut);font-size:13.5px}
/* trilho do processo seletivo: o elemento de identidade */
.trilho{display:flex;align-items:flex-start;margin:4px 0 2px;overflow-x:auto}.trilho .st{flex:1;min-width:84px;position:relative;text-align:center;padding-top:26px;font-size:13px;color:var(--mut)}
.trilho .st:before{content:"";position:absolute;top:9px;left:0;right:0;height:3px;background:var(--line)}.trilho .st:first-child:before{left:50%}.trilho .st:last-child:before{right:50%}

/* rz-elegante: acabamento da tela de entrada do recrutador */
.rz-tela{background:radial-gradient(120% 90% at 18% 30%,#0B2E86 0%,#061846 38%,#030B24 72%)}
.rz-tela::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px);background-size:24px 24px;-webkit-mask-image:radial-gradient(ellipse 70% 70% at 30% 45%,#000 0%,transparent 75%);mask-image:radial-gradient(ellipse 70% 70% at 30% 45%,#000 0%,transparent 75%)}
.rz-fundo .a{opacity:.28}.rz-fundo .b{opacity:.32}.rz-fundo s{opacity:.35}
.rz-foto{right:-90px;top:-70px;width:250px;-webkit-mask-image:radial-gradient(ellipse 50% 42% at 52% 47%,#000 46%,transparent 100%)!important;mask-image:radial-gradient(ellipse 50% 42% at 52% 47%,#000 46%,transparent 100%)!important;-webkit-mask-composite:source-over!important;mask-composite:add!important}
.rz-foto::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,90,220,.10),rgba(3,12,38,.30));mix-blend-mode:multiply}
.rz-esq .rz-tag{color:rgba(255,255,255,.55);letter-spacing:.4em}
.rz-esq h1{font-family:var(--f-disp),var(--f-txt);font-weight:600;letter-spacing:-.025em}
.rz-esq h1 b{font-weight:800;background:linear-gradient(90deg,#3D8BFF 0%,#7FB8FF 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.rz-traco{width:48px;height:3px;background:linear-gradient(90deg,#3D8BFF,#7FB8FF)}
.rz-txt{color:rgba(255,255,255,.72);font-size:16.5px}
.rz-card.lg-card{position:relative;background:#fff;border:1px solid rgba(255,255,255,.7);border-radius:20px;box-shadow:0 30px 80px rgba(0,6,30,.5),0 2px 6px rgba(0,6,30,.15);overflow:hidden}
.rz-card.lg-card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#1F5FE8,#36A3FF,#1F5FE8)}
.rz-card h2{font-family:var(--f-disp),var(--f-txt);font-weight:700;color:#0B1533;letter-spacing:-.025em}
.rz-card .rz-p{color:#5B6485}
.rz-card .lg-in .inp{background:#F6F8FC;border:1px solid #E2E7F1;border-radius:12px;transition:background .15s,border-color .15s,box-shadow .15s}
.rz-card .lg-in .inp:hover{border-color:#CDD5E5}.rz-card .lg-in .inp:focus{background:#fff;border-color:#1F5FE8;box-shadow:0 0 0 4px rgba(31,95,232,.12)}
.rz-card .lg-in svg.ic{color:#7A84A3}
.rz-card .lg-ent{border-radius:12px!important;background:linear-gradient(180deg,#2A6BF2 0%,#1A52D6 100%)!important;border:0!important;box-shadow:0 8px 20px rgba(26,82,214,.32),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .15s,box-shadow .15s;letter-spacing:.01em}
.rz-card .lg-ent:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(26,82,214,.38),inset 0 1px 0 rgba(255,255,255,.18)}
.rz-card .lg-link{text-decoration:none!important;font-weight:600}.rz-card .lg-link:hover{text-decoration:underline!important}
.rz-card .lg-alt{color:#7A84A3}
.rz-seg{border-top:1px solid #EDF0F6;color:#7A84A3}.rz-seg b{color:#3C4566;font-weight:600}.rz-seg svg{color:#9AA3BD}
.rz-rodape{position:absolute;left:clamp(28px,4vw,56px);bottom:18px;z-index:2;font-size:12px;color:rgba(255,255,255,.4);letter-spacing:.02em}
@media (max-width:1000px){.rz-rodape{position:static;text-align:center;padding:0 0 20px}.rz-tela::before{display:none}}
/* ===== Chat de suporte (canto inferior direito) ===== */
#sup-b{position:fixed;right:24px;bottom:24px;z-index:900;width:62px;height:62px;border-radius:50%;border:0;background:#13284B;color:#fff;box-shadow:0 6px 18px rgba(19,40,75,.35);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .15s}
#sup-b:hover{background:#1B3766;transform:scale(1.05)}#sup-b svg{width:36px;height:36px}
#sup-b .dot{position:absolute;top:4px;right:4px;width:14px;height:14px;border-radius:50%;background:#E5484D;border:2px solid #fff;display:none}#sup-b.novo .dot{display:block}
#sup-p{position:fixed;right:24px;bottom:98px;z-index:901;width:370px;height:min(580px,calc(100vh - 120px));background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(11,30,74,.32);display:none;flex-direction:column;overflow:hidden;font-family:var(--f-txt);color:#1B2440}
#sup-p.on{display:flex}
.sp-h{background:#0B1E4A;color:#fff;display:flex;align-items:center;gap:12px;padding:14px 14px 14px 18px}
.sp-h b{flex:1;font-size:16px}.sp-h small{display:block;font-weight:500;font-size:12px;opacity:.75}
.sp-h button{background:transparent;border:0;color:#fff;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:20px;line-height:1}.sp-h button:hover{background:rgba(255,255,255,.12)}
.sp-av{flex:0 0 38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.sp-c{flex:1;overflow-y:auto;background:#F7F8FB;padding:16px 14px}
.sp-dia{text-align:center;color:#7A8199;font-size:12.5px;margin:10px 0}
.sp-m{display:flex;gap:8px;align-items:flex-end;margin:10px 0}.sp-m .bb{max-width:78%;padding:10px 13px;border-radius:14px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.sp-m.bot .bb,.sp-m.dono .bb{background:#EEF0F4;border-bottom-left-radius:4px}.sp-m.dono .bb{background:#E4EDFF}
.sp-m.rh{justify-content:flex-end}.sp-m.rh .bb{background:#1F5FE8;color:#fff;border-bottom-right-radius:4px}
.sp-m .mini{flex:0 0 30px;height:30px;border-radius:50%;background:#fff;border:1px solid #E1E5EE;display:flex;align-items:center;justify-content:center}
.sp-hr{font-size:11.5px;color:#7A8199;margin:-4px 0 0 40px}.sp-m.rh+.sp-hr{text-align:right;margin:-4px 2px 0 0}
.sp-ops{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px 38px;background:#EEF0F4;border-radius:12px;padding:8px}
.sp-ops button{background:#fff;border:0;border-radius:6px;padding:9px 10px;color:#0B5FB8;font:inherit;font-size:14.5px;cursor:pointer;text-align:center}.sp-ops button:hover{background:#F2F6FF}
.sp-ini{display:block;margin:16px auto 6px;background:#E6E9EF;border:1.5px solid #0B1E4A;border-radius:6px;padding:9px 16px;font:inherit;font-weight:600;color:#0B1E4A;cursor:pointer}
.sp-ini:hover{background:#DCE1EA}
.sp-dig{display:flex;gap:4px;padding:10px 12px}.sp-dig i{width:7px;height:7px;border-radius:50%;background:#9AA2B6;animation:spd 1s infinite}.sp-dig i:nth-child(2){animation-delay:.15s}.sp-dig i:nth-child(3){animation-delay:.3s}

.rsl>*{position:relative;min-width:0;zoom:var(--z,1)}
.rsl-mk{display:flex;align-items:center;gap:22px}.rsl-mk>i{width:3px;align-self:stretch;margin:10px 0;background:#2B7BFF;border-radius:2px}.rsl-mk>span{display:flex;flex-direction:column;gap:10px}
.rsl-mk b{font-size:64px;font-weight:800;letter-spacing:.02em;line-height:1;color:#fff;white-space:nowrap}.rsl-mk b em{font-style:normal;color:#2F8CFF}.rsl-mk small{letter-spacing:.42em;font-size:17px;color:#D8E2F6;white-space:nowrap}
.rsl .lg-x{background:linear-gradient(to top right,#fff 0 52%,#2F8CFF 52% 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.rsl-art h1{font-size:clamp(28px,2.6vw,38px);font-weight:700;line-height:1.2;margin:46px 0 0;color:#fff}.rsl-art h1 b{display:block;color:#2F8CFF}
.rsl-art p{color:#C9D3EA;font-size:clamp(16px,1.35vw,20px);max-width:30ch;margin:20px 0 30px;line-height:1.45}
.rsl-ft{display:flex;gap:0}.rsl-ft>div{padding:0 24px;border-left:2px solid rgba(47,140,255,.6);font-size:16px;line-height:1.3;color:#E6ECF8}.rsl-ft>div:first-child{padding-left:0;border-left:0}.rsl-ft svg{width:46px;height:46px;color:#2F8CFF;display:block;margin-bottom:10px}
.rsl-card{justify-self:end;width:600px;background:linear-gradient(160deg,rgba(14,24,52,.80),rgba(5,10,26,.86));border:1.5px solid rgba(70,130,255,.55);border-radius:26px;padding:46px 54px 34px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 46px rgba(43,107,255,.18);backdrop-filter:blur(14px);overflow:hidden}
.rsl-card::after{content:"";position:absolute;right:-2px;bottom:-2px;width:150px;height:150px;background:linear-gradient(135deg,transparent 0 58%,#1E6BFF 58% 63%,transparent 63% 72%,#1E6BFF 72%);border-radius:0 0 24px 0;opacity:.9;pointer-events:none}
.rsl-lema{position:absolute;right:56px;top:30px;font-size:11.5px;letter-spacing:.3em;line-height:1.55;color:#C9D3EA}.rsl-lema i{display:block;width:38px;height:3px;background:#2B7BFF;margin-top:8px}
.rsl-card .rsl-mk{margin:34px 0 46px}.rsl-card .rsl-mk b{font-size:40px}.rsl-card .rsl-mk small{font-size:11.5px;letter-spacing:.3em}.rsl-card .rsl-mk>i{display:none}
.rsl-card h2{font-size:31px;font-weight:700;margin:0 0 12px;color:#fff}.rsl-p{color:#D5DDF0;margin:0 0 34px;font-size:18px;line-height:1.45;max-width:34ch}
.rsl .lg-in{position:relative;margin-bottom:22px}.rsl .lg-in>svg{position:absolute;left:20px;top:50%;transform:translateY(-50%);width:26px;height:26px;color:#C2CDE6;z-index:1}
.rsl .lg-in .inp{height:64px!important;padding:0 58px 0 66px!important;font-size:18px!important;border-radius:14px!important;background:rgba(14,26,58,.72)!important;border:1px solid rgba(110,150,230,.40)!important;color:#fff!important;box-shadow:none!important}
.rsl .lg-in .inp::placeholder{color:#93A2C4}.rsl .lg-in .inp:focus{border-color:#3D86FF!important;box-shadow:0 0 0 3px rgba(43,107,255,.25)!important}
.rsl .lg-in .inp:-webkit-autofill{-webkit-text-fill-color:#fff;-webkit-box-shadow:0 0 0 40px #0E1A3A inset}
.rsl .lg-olho{color:#C2CDE6!important;right:14px}.rsl .lg-olho:hover{background:rgba(255,255,255,.06)}
.rsl .lg-ent{height:68px!important;border-radius:14px!important;background:linear-gradient(180deg,#1E7BFF,#0A57E8)!important;font-size:21px!important;font-weight:600;box-shadow:0 12px 30px rgba(18,99,255,.38)!important;color:#fff!important}
.rsl .lg-link{color:#3F93FF!important;font-size:17px!important;text-decoration:underline!important;text-underline-offset:4px}.rsl .lg-alt{color:#AEBBD8!important;text-align:center}

function bannerTerc(el) {

  el.insertAdjacentHTML('afterbegin', `<section class="panel tc-ban" id="tc-b"><div class="tc-t"><b>Sem tempo para selecionar? A NEXUM faz por você.</b><span>Nossa equipe divulga, faz a triagem e as entrevistas e apresenta só quem tem perfil. <b>R$ ${TERC.porCandidato}</b> por candidato apresentado e <b>R$ ${TERC.porContratado}</b> por contratado, sem mensalidade.</span></div><button class="btn" id="tc-go">Contratar a seleção</button><button class="btn ghost sm" id="tc-x">Ocultar</button></section>`);
  $('#tc-go', el).onclick = () => pedirTerc(); $('#tc-x', el).onclick = () => { localStorage.setItem('rs:terc:oculto:' + S.eid, '1'); $('#tc-b', el).remove(); toast('Aviso ocultado. Você pode contratar a seleção terceirizada em Configurações > Empresa.'); };
}

function contratoTercHTML(d, pub = {}) {

  return `<div class="ctc"><style>.ctc{font-family:Arial,Helvetica,sans-serif;color:#111827;font-size:11px;line-height:1.5;max-width:780px;margin:0 auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}

  .ctc .f{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;border:1px solid #0B1E4A;border-top:0;padding:5px 16px;font-size:10px;background:#EEF3FB;border-radius:0 0 8px 8px}
  .ctc .q{background:#DCE6F5;border:1px solid #9FB3D3;border-bottom:0;padding:4px 8px;font-weight:700;font-size:10px;letter-spacing:.05em;margin-top:10px;color:#0B1E4A;text-transform:uppercase}
  .ctc table{width:100%;border-collapse:collapse}.ctc td,.ctc th{border:1px solid #9FB3D3;padding:5px 8px;vertical-align:top;text-align:left;font-size:11px}.ctc td small{display:block;font-size:8px;color:#4B5B7A;text-transform:uppercase;margin-bottom:1px}.ctc td b{font-size:11px}.ctc th{background:#0B1E4A;color:#fff;font-size:9px;text-transform:uppercase}
  .ctc .o{border:1px solid #9FB3D3;border-top:0;padding:7px 10px;text-align:justify}.ctc .o p{margin:0 0 5px}.ctc .o p:last-child{margin:0}

  .ctc .sel{border:1.5px solid #0F8A5F;border-radius:6px;padding:6px 10px;color:#0F5D41;font-size:9.5px;margin-top:10px}.ctc .h{font-family:"Courier New",monospace;font-size:8.5px;word-break:break-all;color:#4B5B7A;margin-top:6px}
  .ctc .r{display:flex;justify-content:space-between;margin-top:12px;padding-top:6px;border-top:2px solid #0B1E4A;font-size:8.5px;color:#4B5B7A}</style>
  <div class="b">${typeof LOGO_MARCA !== 'undefined' ? `<img src="${LOGO_MARCA}" alt="NEXUM RH">` : '<b style="font-size:18px">NEXUM RH</b>'}<div class="t"><b>Contrato de prestação de serviços</b><span>Recrutamento e seleção terceirizados · versão ${e(c.versao || TERC_CONTRATO_VERSAO)}</span></div></div>
  <div class="f"><span>Pedido <b>${e(d.numero || '')}</b></span><span>Assinado em <b>${e(quando || '—')}</b></span><span>${vagas.length} vaga(s)</span></div>
  <div class="q">1. Partes</div><table><tr>${cel('Contratada', pub.razao || 'NEXUM RH', 2)}${cel('CNPJ', pub.cnpj || '')}</tr><tr>${cel('Contratante', d.empresa, 2)}${cel('CNPJ', d.cnpj)}</tr><tr>${cel('Responsável', c.nome || d.responsavel)}${cel('CPF do responsável', c.cpf)}${cel('Cidade/UF', d.cidade)}</tr><tr>${cel('E-mail', d.email, 2)}${cel('WhatsApp', d.whatsapp)}</tr></table>
  <div class="q">2. Objeto e vagas</div><div class="o"><p>A CONTRATADA prestará à CONTRATANTE o serviço de recrutamento e seleção de candidatos para as vagas abaixo, com divulgação, triagem, testes e entrevistas (inclusive por vídeo), apresentando os candidatos com o perfil pedido e um parecer de cada um.</p></div>
  ${vagas.length ? `<table><tr><th>Cargo</th><th>Loja</th><th>Quantidade</th><th>Salário</th></tr>${vagas.map(v => `<tr><td>${e(v.cargo)}</td><td>${e(v.loja)}</td><td>${e(v.qtd || 1)}</td><td>${e(v.salario)}</td></tr>`).join('')}</table>` : ''}${d.obs ? `<div class="o"><p><b>Perfil e observações:</b> ${e(d.obs)}</p></div>` : ''}
  <div class="q">3. Preço e definições</div><div class="o"><p><b>R$ ${ap},00 por candidato apresentado</b> e <b>R$ ${ct},00 por candidato contratado</b>. Não há mensalidade, taxa de adesão nem fidelidade.</p><p>Candidato <b>apresentado</b> é o enviado à CONTRATANTE com currículo e parecer. Candidato <b>contratado</b> é o apresentado que for admitido pela CONTRATANTE, ou por empresa do mesmo grupo, em qualquer cargo, em até 90 dias da apresentação.</p></div>
  <div class="q">4. Pagamento</div><div class="o"><p>Os valores dos apresentados são cobrados após a apresentação, e o do contratado, após a admissão, com vencimento em 5 dias úteis da cobrança, por PIX ou link de pagamento. Atrasos ficam sujeitos a multa de 2% e juros de 1% ao mês. A CONTRATANTE informará à CONTRATADA a admissão de candidato apresentado.</p></div>
  <div class="q">5. Obrigações</div><div class="o"><p><b>CONTRATANTE:</b> informar dados verdadeiros da vaga (cargo, loja, salário, horário e benefícios); dar retorno sobre os candidatos em até 5 dias úteis; usar os dados dos candidatos só para este processo; não praticar discriminação (Lei nº 9.029/1995).</p><p><b>CONTRATADA:</b> conduzir a seleção com ética e sem discriminação; proteger os dados pessoais dos candidatos (Lei nº 13.709/2018); manter a CONTRATANTE informada do andamento. O anúncio pode mostrar o nome e a foto da loja; o endereço só é passado ao candidato aprovado, no fim, para falar com o gerente.</p></div>
  <div class="q">6. Vínculo, vigência e encerramento</div><div class="o"><p>A decisão de contratar é sempre da CONTRATANTE, única empregadora do candidato contratado. A CONTRATADA não garante a permanência nem o desempenho do contratado e não responde pelas obrigações do contrato de trabalho. Este contrato vale até o preenchimento das vagas e pode ser encerrado pela CONTRATANTE a qualquer momento, pagando apenas o que já foi entregue. Aplicam-se, no que couber, o Contrato de Prestação de Serviços e a Política de Privacidade publicados em nexumdp.com.br. Fica eleito o foro da comarca da sede da CONTRATADA, ressalvado o direito do consumidor de propor ação no seu domicílio.</p></div>
  <div class="q">7. Assinatura eletrônica</div><div class="o"><p>As partes reconhecem a validade da assinatura eletrônica deste contrato, nos termos dos arts. 107 e 425 do Código Civil e do art. 10, § 2º, da MP nº 2.200-2/2001. Foram registrados a data e a hora, os dados acima, a assinatura desenhada e o código de integridade abaixo.</p></div>
  <div class="ass"><div>${c.assinatura ? `<img src="${c.assinatura}" alt="Assinatura">` : '<div style="height:60px"></div>'}<div class="ln">${e(c.nome || d.responsavel || '')}<small>CONTRATANTE · ${e(d.empresa || '')}${c.cpf ? ' · CPF ' + e(c.cpf) : ''}</small></div></div><div><div style="height:60px;display:flex;align-items:flex-end;justify-content:center;font-size:9.5px;color:#0F5D41">Aceite registrado pela plataforma</div><div class="ln">${e(pub.razao || 'NEXUM RH')}<small>CONTRATADA${pub.cnpj ? ' · CNPJ ' + e(pub.cnpj) : ''}</small></div></div></div>
  ${c.em ? `<div class="sel">✓ Assinado eletronicamente em ${e(quando)}${c.navegador ? ' · ' + e(String(c.navegador).slice(0, 90)) : ''}</div>` : ''}${c.hash ? `<div class="h">Código de integridade (SHA-256): ${e(c.hash)}</div>` : ''}

function quadroAssinatura(cv) {
  const x = cv.getContext('2d'); let des = false, usou = false; const ajusta = () => { const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; cv.width = r.width * dpr; cv.height = r.height * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0); x.lineWidth = 2.2; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#0B1E4A'; };

    <div class="panel" style="margin:0"><h2 style="margin-bottom:4px">De onde vêm os contratados</h2><p class="hint" style="margin:0 0 6px">Inscritos (azul-claro) e aprovados (verde) por origem.</p>${O.map(([o, x]) => `<div style="display:grid;grid-template-columns:130px 1fr 70px;gap:10px;align-items:center;margin:7px 0"><span style="font-size:13.5px">${esc(o)}</span><span style="position:relative;height:14px;border-radius:7px;background:#EEF1F7;overflow:hidden"><i style="position:absolute;inset:0 auto 0 0;width:${Math.round(x.i / oMax * 100)}%;background:#B9C7EE;border-radius:7px"></i><i style="position:absolute;inset:0 auto 0 0;width:${Math.round(x.c / oMax * 100)}%;background:var(--e-aprovado);border-radius:7px"></i></span><span style="font-size:13px;text-align:right"><b>${x.c}</b> de ${x.i}</span></div>`).join('')}</div>
    <div class="panel" style="margin:0"><h2 style="margin-bottom:8px">Tempo</h2><div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px"><b style="font-size:30px">${tAprov ?? '—'}</b><span class="hint">${tAprov === null ? 'ainda sem aprovações com data' : `dia${tAprov === 1 ? '' : 's'} em média da inscrição até a aprovação`}</span></div><p class="hint" style="margin:0 0 4px">Há quanto tempo, em média, as pessoas estão paradas em cada etapa:</p>${parado.map(p => barra(p.t, p.d ?? 0, pMax, cor(p.k), p.d === null ? '' : ' d')).join('')}</div></section>`);
}

function supPagCard(pg) { const v = 'R$ ' + (+pg.valor || 0).toFixed(2).replace('.', ','), dt = String(pg.vencimento || '').split('-').reverse().join('/'); return `<div class="sp-pg"><b>💳 ${v}</b><span>vence em ${dt}</span><div class="sp-pg-b"><a href="${esc(pg.fatura)}" target="_blank" rel="noopener">Pagar agora</a>${pg.pix ? `<button type="button" data-sppix="${esc(pg.pix)}">Copiar PIX</button>` : ''}</div></div>`; }
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('[data-sppix]'); if (!b) return; (navigator.clipboard ? navigator.clipboard.writeText(b.dataset.sppix) : Promise.reject()).then(() => { b.textContent = 'Copiado!'; setTimeout(() => { b.textContent = 'Copiar PIX'; }, 2000); }).catch(() => prompt('Copie:', b.dataset.sppix)); });
document.head.insertAdjacentHTML('beforeend', `<style>.sp-pg{margin-top:8px;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid #C9D6F2;display:flex;flex-direction:column;gap:2px;white-space:normal}.sp-pg span{font-size:12.5px;color:#6B7280}.sp-pg-b{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.sp-pg-b a,.sp-pg-b button{flex:1;text-align:center;padding:8px 10px;border-radius:9px;font-weight:700;font-size:13.5px;text-decoration:none;cursor:pointer;border:1px solid #1F5FE8}.sp-pg-b a{background:#1F5FE8;color:#fff}.sp-pg-b button{background:#fff;color:#1F5FE8}</style>`);
