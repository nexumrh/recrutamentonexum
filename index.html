<style>:root{--bg:#F3F5FA;--sf:#fff;--ink:#14203D;--mut:#5F6B85;--line:#DCE1EC;--line2:#EDF0F6;--pri:#2448D8;--pri-d:#1A36AE;--pri-s:#E6EBFF;--ok:#0F8A5F;--ok-s:#E3F5EC;--bad:#C23A2B;--bad-s:#FBE7E4;--warn:#9A5D00;--warn-s:#FFF2D9;--hl:#FFD84D;--nav:#14203D;--r:10px;--rs:6px;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:15px/1.5 Archivo,"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.01em}h1{font-size:26px;font-weight:800}h2{font-size:18px;font-weight:700}h3{font-size:15px;font-weight:700}
a{color:var(--pri)}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.hidden{display:none!important}.sp{flex:1}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.end{justify-content:flex-end}
.hint{color:var(--mut);font-size:13.5px}.note{color:var(--mut);font-size:13px;margin:12px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:var(--rs);padding:9px 16px;font-weight:600;cursor:pointer;text-decoration:none;min-height:40px;white-space:nowrap}
.btn:hover{background:var(--pri-d)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:var(--sf);color:var(--ink);border-color:var(--line)}.btn.sec:hover{border-color:var(--ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--pri)}.btn.ghost:hover{background:var(--pri-s)}
.btn.ok{background:var(--ok);border-color:var(--ok)}.btn.bad{background:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13.5px}
.inp{width:100%;border:1px solid var(--line);border-radius:var(--rs);padding:9px 11px;background:var(--sf);min-height:40px}
.inp:focus{border-color:var(--pri);outline:none;box-shadow:0 0 0 3px var(--pri-s)}textarea.inp{min-height:90px;resize:vertical}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.fld>label,.lbl{font-weight:600;font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0 16px}.full{grid-column:1/-1}
.panel{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;background:var(--line2);color:var(--mut);white-space:nowrap}
.pill.ok{background:var(--ok-s);color:var(--ok)}.pill.bad{background:var(--bad-s);color:var(--bad)}.pill.warn{background:var(--warn-s);color:var(--warn)}.pill.pri{background:var(--pri-s);color:var(--pri)}
.list{list-style:none;margin:0;padding:0}.list li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line2)}.list li:last-child{border-bottom:0}
.list .t{flex:1;min-width:0}.list .t>div:last-child:not(:first-child){color:var(--mut);font-size:13.5px}.link{cursor:pointer}.link:hover{background:var(--bg)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--sf)}table{width:100%;border-collapse:collapse}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line2);font-size:14px;vertical-align:top}th{font-size:13px;color:var(--mut);font-weight:600;background:#FAFBFD}td.n,th.n{text-align:right}
.empty{text-align:center;color:var(--mut);padding:34px 16px}.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}.tabs button.on{color:var(--ink);border-bottom-color:var(--pri)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.kpi{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}.kpi b{display:block;font-size:28px;font-weight:800;line-height:1.1}.kpi span{color:var(--mut);font-size:13.5px}
/* trilho do processo seletivo: o elemento de identidade */
.trilho{display:flex;align-items:flex-start;margin:4px 0 2px;overflow-x:auto}.trilho .st{flex:1;min-width:84px;position:relative;text-align:center;padding-top:26px;font-size:13px;color:var(--mut)}
.trilho .st:before{content:"";position:absolute;top:9px;left:0;right:0;height:3px;background:var(--line)}.trilho .st:first-child:before{left:50%}.trilho .st:last-child:before{right:50%}
.trilho .st i{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:17px;height:17px;border-radius:50%;background:var(--sf);border:3px solid var(--line);z-index:1}
.trilho .st.feito:before,.trilho .st.feito i{background:var(--pri);border-color:var(--pri)}.trilho .st.feito{color:var(--ink)}
.trilho .st.agora{color:var(--ink);font-weight:700}.trilho .st.agora i{background:var(--hl);border-color:var(--ink)}.trilho .st.agora span{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.trilho .st.fim-bad i{background:var(--bad);border-color:var(--bad)}.trilho .st b{display:block;font-size:22px;font-weight:800;color:var(--ink)}
/* modal e avisos */
#modal-root .ov{position:fixed;inset:0;background:rgba(20,32,61,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 14px;z-index:50;overflow-y:auto}
.modal{background:var(--sf);border-radius:12px;width:100%;max-width:560px;box-shadow:0 24px 60px rgba(20,32,61,.25)}.modal.lg{max-width:920px}.modal.sm{max-width:420px}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line2)}.modal-h h3{flex:1;font-size:17px}.modal-h .x{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--mut)}
.modal-b{padding:18px 20px}.modal-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line2)}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}.toast.bad{background:var(--bad)}
/* perguntas */
.perg{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;background:var(--sf)}.perg .enun{font-weight:600;margin-bottom:10px}
.opc{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line2);border-radius:var(--rs);margin-bottom:6px;cursor:pointer}.opc:hover{border-color:var(--pri)}.opc input{margin-top:4px}
.opc.certa{border-color:var(--ok);background:var(--ok-s)}.opc.errada{border-color:var(--bad);background:var(--bad-s)}
.escala{display:flex;gap:6px}.escala label{flex:1;position:relative}.escala input{position:absolute;opacity:0}.escala span{display:block;text-align:center;border:1px solid var(--line);border-radius:var(--rs);padding:9px 0;font-weight:700;cursor:pointer}.escala input:checked+span{background:var(--pri);border-color:var(--pri);color:#fff}.escala input:focus-visible+span{outline:3px solid var(--pri)}
/* sala de vídeo */
.sala{position:fixed;inset:0;background:#0E1630;z-index:60;display:grid;grid-template-columns:1fr 380px;color:#fff}
.sala .palco{position:relative;display:flex;flex-direction:column;min-width:0}.sala .vids{flex:1;position:relative;background:#0A1024}
.sala video{background:#000}.sala #v-remoto{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.sala #v-local{position:absolute;right:16px;bottom:16px;width:min(26%,220px);aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:2px solid rgba(255,255,255,.6)}
.sala .est{position:absolute;left:16px;top:14px;background:rgba(0,0,0,.45);padding:5px 12px;border-radius:999px;font-size:13.5px}
.sala .ctrl{display:flex;gap:10px;justify-content:center;padding:14px;background:#0E1630}.sala .ctrl .btn.sec,.sala .ctrl .btn.sec:hover,.sala .ctrl a.btn.sec{background:#26304F;border-color:#26304F;color:#fff!important}
.sala .lado{background:var(--bg);color:var(--ink);overflow-y:auto;padding:16px}
@media(max-width:860px){.sala{grid-template-columns:1fr;grid-template-rows:1fr auto}.sala .lado{max-height:45vh}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:560px){.trilho .st{min-width:0;font-size:11.5px}.trilho .st b{font-size:18px}}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--nav);color:#fff;display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh}
.marca{font-weight:800;font-size:19px;letter-spacing:.02em}.marca span{font-weight:500;opacity:.75}
.side .emp{font-size:13.5px;opacity:.75;margin:2px 0 18px;min-height:18px}
.side .nav{display:flex;flex-direction:column;gap:2px;flex:1}.side .nav button{text-align:left;border:0;background:none;color:#C9D2E8;padding:9px 12px;border-radius:7px;font-weight:600;cursor:pointer}
.side .nav button:hover{background:rgba(255,255,255,.07);color:#fff}.side .nav button.on{background:#fff;color:var(--ink)}
.side .eu{border-top:1px solid rgba(255,255,255,.12);padding-top:12px;display:flex;flex-direction:column;gap:2px}.side .eu span{font-size:13px;opacity:.7}.side .eu .btn{color:#fff;justify-content:flex-start;padding-left:0}
.main{padding:22px 28px 60px;min-width:0}.top{display:flex;align-items:center;margin-bottom:18px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:0 16px}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px}
.kcol{background:#E9EDF5;border-radius:var(--r);padding:10px;min-height:200px}.kcol h3{padding:4px 4px 10px;font-size:14px}
.kcard{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer}.kcard:hover{border-color:var(--pri)}
.kcard .ch{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.kcard .ch i{font-style:normal;font-size:12px;font-weight:600;background:var(--pri-s);color:var(--pri);border-radius:4px;padding:1px 6px}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto}.msg{max-width:80%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;white-space:pre-wrap;align-self:flex-start}.msg.eu{align-self:flex-end;background:var(--pri-s);border-color:#C9D4FF}.msg small{display:block;color:var(--mut);font-size:12px;margin-top:4px}
.auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}.auth-lado{background:var(--nav);color:#fff;padding:9vh 7vw;display:flex;flex-direction:column;gap:22px}.auth-lado h1{font-size:clamp(28px,3.4vw,42px);max-width:15ch;line-height:1.1}.auth-lado p{color:#C9D2E8;max-width:46ch}
.auth-lado .trilho .st{color:#9FAACB}.auth-lado .trilho .st.agora{color:#fff}.auth-lado .trilho .st:before{background:#34416A}.auth-lado .trilho .st i{background:var(--nav);border-color:#34416A}.auth-lado .trilho .st.feito i,.auth-lado .trilho .st.feito:before{background:#7F9BFF;border-color:#7F9BFF}.auth-lado .trilho .st.agora span{color:var(--ink);background:var(--hl);padding:1px 6px;border-radius:3px}
.auth-form{padding:12vh 6vw;max-width:520px;width:100%;align-self:start}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding:12px}.side .emp{display:none}.side .nav{flex-direction:row;overflow-x:auto;flex-basis:100%;order:3}.side .nav button{white-space:nowrap}.side .eu{border:0;padding:0;flex-direction:row;align-items:center;gap:8px;margin-left:auto}.side .eu span{display:none}.main{padding:16px}.auth{grid-template-columns:1fr}.auth-lado{padding:32px 22px}.auth-form{padding:24px 22px}}
.kcard[draggable="true"]{cursor:grab}.kcard.arrastando{opacity:.45}.kcol.alvo{outline:2px dashed var(--pri);outline-offset:-4px}
.slots{display:flex;flex-wrap:wrap;gap:8px}.slot{display:flex;align-items:center;gap:8px;border:1px solid var(--pri);border-radius:8px;padding:6px 10px;background:var(--sf)}.slot b{color:var(--pri)}.slot span{font-size:13px;color:var(--mut)}.slot.ocup{border-color:var(--line);background:var(--line2)}.slot.ocup b{color:var(--ink)}
.panel.ia{border-color:#C9D4FF;background:#F7F9FF}
.sala .vids.grupo{display:flex;flex-direction:column}.sala .grade{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;padding:8px;align-content:center}.vg-tile{position:relative;background:#000;border-radius:8px;aspect-ratio:4/3;overflow:hidden}.vg-tile video{width:100%;height:100%;object-fit:cover}.vg-tile span{position:absolute;left:8px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;padding:2px 10px;border-radius:999px;font-size:12.5px}.vg-eu{position:absolute;right:16px;bottom:16px;width:min(22%,180px);aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:2px solid rgba(255,255,255,.6);z-index:3;background:#000}@media(max-width:560px){.sala .ctrl{flex-wrap:wrap;gap:6px;padding:10px}.sala .ctrl .btn{padding:7px 10px;font-size:13.5px;min-height:36px}}/* ===== NEXUM Recrutamento · identidade visual v2 ===== */
:root{--ink:#1C2140;--ink2:#4A5170;--ink3:#7A809B;--paper:#F5F6FA;--card:#FFFFFF;--line:#E4E6EF;--line2:#EEF0F5;--pri:#3B4BD8;--pri-d:#2E3BB0;--pri-s:#ECEEFD;
--e-inscrito:#64748B;--e-triagem:#4F46E5;--e-teste:#7C3AED;--e-entrevista:#C2730A;--e-aprovado:#0F8A5F;--e-reprovado:#D0364F;--e-desistiu:#9AA0B4;
--ok:#0F8A5F;--ok-s:#E7F6EF;--warn:#B76E00;--warn-s:#FFF4E0;--bad:#D0364F;--bad-s:#FDECEF;
--f-disp:'Bricolage Grotesque',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;--f-txt:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
html,body{background:var(--paper);color:var(--ink);font-family:var(--f-txt);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-disp);color:var(--ink);letter-spacing:-.01em}
.hint{color:var(--ink3)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ----- recrutador ----- */
.app{background:var(--paper)}
.side{background:var(--card)!important;color:var(--ink)!important;border-right:1px solid var(--line);width:236px;padding:20px 14px 16px!important}
.side .marca{font-family:var(--f-disp);font-weight:800;font-size:20px;color:var(--ink)!important;letter-spacing:-.02em;line-height:1.15}

.side .emp{color:var(--ink3)!important;font-size:13px;margin:6px 0 20px;padding-bottom:16px;border-bottom:1px solid var(--line2)}
.side .nav{gap:2px}
.side .nav button{display:flex;align-items:center;gap:11px;color:var(--ink2)!important;background:transparent!important;font-size:14.5px;font-weight:600;padding:9px 12px;border-radius:9px;position:relative}
.side .nav button svg{width:19px;height:19px;flex:0 0 19px;color:var(--ink3)}
.side .nav button:hover{background:var(--line2)!important;color:var(--ink)!important}
.side .nav button.on,.side .nav button[aria-current=page]{background:var(--pri-s)!important;color:var(--pri-d)!important}
.side .nav button.on svg,.side .nav button[aria-current=page] svg{color:var(--pri)}
.side .eu{border-top:1px solid var(--line2);color:var(--ink)!important;padding-top:14px}
.side .eu b{color:var(--ink)!important}.side .eu span{color:var(--ink3)!important}
.side .eu .btn{color:var(--ink2)!important;padding-left:0}
.main{background:var(--paper)}
.top{background:transparent!important;border:0!important;padding:28px 36px 6px!important;align-items:flex-end}
.top h1{font-size:30px;font-weight:800;margin:0;letter-spacing:-.025em}
#t-sub{margin:4px 0 0;color:var(--ink2);font-size:15px;max-width:70ch}
#view{padding:18px 36px 48px!important;max-width:1280px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:none;padding:20px 22px}
.panel h2{font-size:17px;font-weight:700}
.kpis{gap:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:none}
.kpi b{font-family:var(--f-disp);font-size:32px;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
.kpi span{color:var(--ink2);font-size:13.5px}
.btn{font-family:var(--f-txt);font-weight:700;border-radius:10px;font-size:14px;padding:9px 16px;background:var(--pri);border-color:var(--pri)}.btn,.btn:hover,button.btn,a.btn{color:#fff!important}.btn.sec,.btn.sec:hover,button.btn.sec{color:var(--ink)!important}.btn.ghost,.btn.ghost:hover,button.btn.ghost{color:var(--pri)!important}
.btn:hover{background:var(--pri-d)}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{background:var(--line2)}
.btn.ghost{background:transparent;color:var(--pri);border-color:transparent}
.btn.ghost:hover{background:var(--pri-s)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.ok{background:var(--ok);border-color:var(--ok)}.btn.bad{background:var(--bad);border-color:var(--bad)}
.inp,select.inp,textarea.inp{border:1px solid var(--line);border-radius:10px;font-family:var(--f-txt);font-size:14.5px;background:var(--card);color:var(--ink)}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-s)}
.fld label{font-size:13.5px;font-weight:600;color:var(--ink2)}
.pill{font-weight:700;font-size:12.5px;border-radius:999px;padding:3px 10px}
.pill.ok{background:var(--ok-s);color:var(--ok)}.pill.warn{background:var(--warn-s);color:var(--warn)}.pill.bad{background:var(--bad-s);color:var(--bad)}.pill.pri{background:var(--pri-s);color:var(--pri-d)}
.tabs{border-bottom:1px solid var(--line);gap:4px}
.tabs button{font-family:var(--f-txt);font-weight:600;font-size:14.5px;color:var(--ink2);padding:10px 14px}
.tabs button.on,.tabs button[aria-selected=true]{color:var(--pri-d);box-shadow:inset 0 -2px 0 var(--pri)}
.tbl-wrap{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:auto}
.tbl-wrap table{border-collapse:collapse;width:100%}
.tbl-wrap th{font-size:13px;font-weight:600;color:var(--ink3);text-transform:none;letter-spacing:0;background:transparent;border-bottom:1px solid var(--line);padding:12px 16px}
.tbl-wrap td{padding:14px 16px;border-bottom:1px solid var(--line2);font-size:14.5px;vertical-align:middle}
.tbl-wrap tr:last-child td{border-bottom:0}
.list li{border-color:var(--line2);padding:12px 0}
.list li .t div:first-child{font-weight:500}
.empty,.vazio-b{text-align:center;color:var(--ink2);padding:28px 16px}
/* funil do painel */

/* rz-elegante: acabamento da tela de entrada do recrutador */
.rz-tela{background:radial-gradient(120% 90% at 18% 30%,#0B2E86 0%,#061846 38%,#030B24 72%)}
.rz-tela::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px);background-size:24px 24px;-webkit-mask-image:radial-gradient(ellipse 70% 70% at 30% 45%,#000 0%,transparent 75%);mask-image:radial-gradient(ellipse 70% 70% at 30% 45%,#000 0%,transparent 75%)}
.rz-fundo .a{opacity:.28}.rz-fundo .b{opacity:.32}.rz-fundo s{opacity:.35}
.rz-foto{right:-90px;top:-70px;width:250px;-webkit-mask-image:radial-gradient(ellipse 50% 42% at 52% 47%,#000 46%,transparent 100%)!important;mask-image:radial-gradient(ellipse 50% 42% at 52% 47%,#000 46%,transparent 100%)!important;-webkit-mask-composite:source-over!important;mask-composite:add!important}
.rz-foto::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,90,220,.10),rgba(3,12,38,.30));mix-blend-mode:multiply}
.rz-esq .rz-tag{color:rgba(255,255,255,.55);letter-spacing:.4em}
.rz-esq h1{font-family:var(--f-disp),var(--f-txt);font-weight:600;letter-spacing:-.025em}
.rz-esq h1 b{font-weight:800;background:linear-gradient(90deg,#3D8BFF 0%,#7FB8FF 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.rz-traco{width:48px;height:3px;background:linear-gradient(90deg,#3D8BFF,#7FB8FF)}
.rz-txt{color:rgba(255,255,255,.72);font-size:16.5px}
.rz-card.lg-card{position:relative;background:#fff;border:1px solid rgba(255,255,255,.7);border-radius:20px;box-shadow:0 30px 80px rgba(0,6,30,.5),0 2px 6px rgba(0,6,30,.15);overflow:hidden}
.rz-card.lg-card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#1F5FE8,#36A3FF,#1F5FE8)}
.rz-card h2{font-family:var(--f-disp),var(--f-txt);font-weight:700;color:#0B1533;letter-spacing:-.025em}
.rz-card .rz-p{color:#5B6485}
.rz-card .lg-in .inp{background:#F6F8FC;border:1px solid #E2E7F1;border-radius:12px;transition:background .15s,border-color .15s,box-shadow .15s}
.rz-card .lg-in .inp:hover{border-color:#CDD5E5}.rz-card .lg-in .inp:focus{background:#fff;border-color:#1F5FE8;box-shadow:0 0 0 4px rgba(31,95,232,.12)}
.rz-card .lg-in svg.ic{color:#7A84A3}
.rz-card .lg-ent{border-radius:12px!important;background:linear-gradient(180deg,#2A6BF2 0%,#1A52D6 100%)!important;border:0!important;box-shadow:0 8px 20px rgba(26,82,214,.32),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .15s,box-shadow .15s;letter-spacing:.01em}
.rz-card .lg-ent:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(26,82,214,.38),inset 0 1px 0 rgba(255,255,255,.18)}
.rz-card .lg-link{text-decoration:none!important;font-weight:600}.rz-card .lg-link:hover{text-decoration:underline!important}
.rz-card .lg-alt{color:#7A84A3}
.rz-seg{border-top:1px solid #EDF0F6;color:#7A84A3}.rz-seg b{color:#3C4566;font-weight:600}.rz-seg svg{color:#9AA3BD}
.rz-rodape{position:absolute;left:clamp(28px,4vw,56px);bottom:18px;z-index:2;font-size:12px;color:rgba(255,255,255,.4);letter-spacing:.02em}
@media (max-width:1000px){.rz-rodape{position:static;text-align:center;padding:0 0 20px}.rz-tela::before{display:none}}
/* ===== Chat de suporte (canto inferior direito) ===== */
#sup-b{position:fixed;right:24px;bottom:24px;z-index:900;width:62px;height:62px;border-radius:50%;border:0;background:#13284B;color:#fff;box-shadow:0 6px 18px rgba(19,40,75,.35);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .15s}
#sup-b:hover{background:#1B3766;transform:scale(1.05)}#sup-b svg{width:36px;height:36px}
#sup-b .dot{position:absolute;top:4px;right:4px;width:14px;height:14px;border-radius:50%;background:#E5484D;border:2px solid #fff;display:none}#sup-b.novo .dot{display:block}
#sup-p{position:fixed;right:24px;bottom:98px;z-index:901;width:370px;height:min(580px,calc(100vh - 120px));background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(11,30,74,.32);display:none;flex-direction:column;overflow:hidden;font-family:var(--f-txt);color:#1B2440}
#sup-p.on{display:flex}
.sp-h{background:#0B1E4A;color:#fff;display:flex;align-items:center;gap:12px;padding:14px 14px 14px 18px}
.sp-h b{flex:1;font-size:16px}.sp-h small{display:block;font-weight:500;font-size:12px;opacity:.75}
.sp-h button{background:transparent;border:0;color:#fff;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:20px;line-height:1}.sp-h button:hover{background:rgba(255,255,255,.12)}
.sp-av{flex:0 0 38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.sp-c{flex:1;overflow-y:auto;background:#F7F8FB;padding:16px 14px}
.sp-dia{text-align:center;color:#7A8199;font-size:12.5px;margin:10px 0}
.sp-m{display:flex;gap:8px;align-items:flex-end;margin:10px 0}.sp-m .bb{max-width:78%;padding:10px 13px;border-radius:14px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.sp-m.bot .bb,.sp-m.dono .bb{background:#EEF0F4;border-bottom-left-radius:4px}.sp-m.dono .bb{background:#E4EDFF}
.sp-m.rh{justify-content:flex-end}.sp-m.rh .bb{background:#1F5FE8;color:#fff;border-bottom-right-radius:4px}
.sp-m .mini{flex:0 0 30px;height:30px;border-radius:50%;background:#fff;border:1px solid #E1E5EE;display:flex;align-items:center;justify-content:center}
.sp-hr{font-size:11.5px;color:#7A8199;margin:-4px 0 0 40px}.sp-m.rh+.sp-hr{text-align:right;margin:-4px 2px 0 0}
.sp-ops{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px 38px;background:#EEF0F4;border-radius:12px;padding:8px}
.sp-ops button{background:#fff;border:0;border-radius:6px;padding:9px 10px;color:#0B5FB8;font:inherit;font-size:14.5px;cursor:pointer;text-align:center}.sp-ops button:hover{background:#F2F6FF}
.sp-ini{display:block;margin:16px auto 6px;background:#E6E9EF;border:1.5px solid #0B1E4A;border-radius:6px;padding:9px 16px;font:inherit;font-weight:600;color:#0B1E4A;cursor:pointer}
.sp-ini:hover{background:#DCE1EA}
.sp-dig{display:flex;gap:4px;padding:10px 12px}.sp-dig i{width:7px;height:7px;border-radius:50%;background:#9AA2B6;animation:spd 1s infinite}.sp-dig i:nth-child(2){animation-delay:.15s}.sp-dig i:nth-child(3){animation-delay:.3s}
