<style>:root{--bg:#F3F5FA;--sf:#fff;--ink:#14203D;--mut:#5F6B85;--line:#DCE1EC;--line2:#EDF0F6;--pri:#2448D8;--pri-d:#1A36AE;--pri-s:#E6EBFF;--ok:#0F8A5F;--ok-s:#E3F5EC;--bad:#C23A2B;--bad-s:#FBE7E4;--warn:#9A5D00;--warn-s:#FFF2D9;--hl:#FFD84D;--nav:#14203D;--r:10px;--rs:6px;color-scheme:light}

.kcard .ch{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.kcard .ch i{font-style:normal;font-size:12px;font-weight:600;background:var(--pri-s);color:var(--pri);border-radius:4px;padding:1px 6px}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto}.msg{max-width:80%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;white-space:pre-wrap;align-self:flex-start}.msg.eu{align-self:flex-end;background:var(--pri-s);border-color:#C9D4FF}.msg small{display:block;color:var(--mut);font-size:12px;margin-top:4px}

.auth-lado .trilho .st{color:#9FAACB}.auth-lado .trilho .st.agora{color:#fff}.auth-lado .trilho .st:before{background:#34416A}.auth-lado .trilho .st i{background:var(--nav);border-color:#34416A}.auth-lado .trilho .st.feito i,.auth-lado .trilho .st.feito:before{background:#7F9BFF;border-color:#7F9BFF}.auth-lado .trilho .st.agora span{color:var(--ink);background:var(--hl);padding:1px 6px;border-radius:3px}
.auth-form{padding:12vh 6vw;max-width:520px;width:100%;align-self:start}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding:12px}.side .emp{display:none}.side .nav{flex-direction:row;overflow-x:auto;flex-basis:100%;order:3}.side .nav button{white-space:nowrap}.side .eu{border:0;padding:0;flex-direction:row;align-items:center;gap:8px;margin-left:auto}.side .eu span{display:none}.main{padding:16px}.auth{grid-template-columns:1fr}.auth-lado{padding:32px 22px}.auth-form{padding:24px 22px}}
.kcard[draggable="true"]{cursor:grab}.kcard.arrastando{opacity:.45}.kcol.alvo{outline:2px dashed var(--pri);outline-offset:-4px}
.slots{display:flex;flex-wrap:wrap;gap:8px}.slot{display:flex;align-items:center;gap:8px;border:1px solid var(--pri);border-radius:8px;padding:6px 10px;background:var(--sf)}.slot b{color:var(--pri)}.slot span{font-size:13px;color:var(--mut)}.slot.ocup{border-color:var(--line);background:var(--line2)}.slot.ocup b{color:var(--ink)}
.panel.ia{border-color:#C9D4FF;background:#F7F9FF}
.sala .vids.grupo{display:flex;flex-direction:column}.sala .grade{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;padding:8px;align-content:center}.vg-tile{position:relative;background:#000;border-radius:8px;aspect-ratio:4/3;overflow:hidden}.vg-tile video{width:100%;height:100%;object-fit:cover}.vg-tile span{position:absolute;left:8px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;padding:2px 10px;border-radius:999px;font-size:12.5px}.vg-eu{position:absolute;right:16px;bottom:16px;width:min(22%,180px);aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:2px solid rgba(255,255,255,.6);z-index:3;background:#000}@media(max-width:560px){.sala .ctrl{flex-wrap:wrap;gap:6px;padding:10px}.sala .ctrl .btn{padding:7px 10px;font-size:13.5px;min-height:36px}}</style></head>

/* ---------- Firebase ---------- */
let APP, auth, db;
function iniciarFirebase(nomeApp) {

  const l = S.d.apps.filter(a => atrasoSLA(a) > 0).sort((x, y) => atrasoSLA(y) - atrasoSLA(x)), porVaga = {}; l.forEach(a => { porVaga[a.vagaId] = (porVaga[a.vagaId] || 0) + 1; });
  const sec = `<section class="panel" style="${l.length ? 'border-color:var(--warn)' : ''}"><div class="panel-head" style="margin-bottom:6px"><h2 style="flex:1">Prazos das etapas</h2><span class="pill ${l.length ? 'warn' : 'ok'}">${l.length ? `${l.length} atrasado(s) em ${Object.keys(porVaga).length} vaga(s)` : 'Tudo no prazo'}</span></div>
    ${l.length ? `<ul class="list">${l.slice(0, 8).map(a => `<li class="link" data-ab="${a.id}"><div class="t"><div><b>${esc(a.perfil.nome)}</b> · ${esc(vagaDe(a.vagaId).titulo || a.vagaTitulo || '')}</div><div>${esc(ETAPA[a.etapa] || a.etapa)} há ${diffD(new Date(a.atualizadoEm || a.criadoEm), new Date())} dias · prazo de ${prazoEtapa(a.etapa)} dias</div></div><span class="pill bad">+${atrasoSLA(a)}d</span></li>`).join('')}</ul>` : '<p class="hint" style="margin:0">Nenhum candidato parado além do prazo definido em Configurações.</p>'}</section>`;
  const k = $('.kpis', el); if (k) k.insertAdjacentHTML('afterend', sec); else el.insertAdjacentHTML('afterbegin', sec);
  $$('[data-ab]', el).forEach(li => li.onclick = () => abrirCand(li.dataset.ab));
}
function cfgPrazos(w) {
  const s = { ...SLA_PADRAO, ...(S.emp.sla || {}) };
  w.innerHTML = `<section class="panel"><p class="hint" style="margin-top:0">Quantos dias um candidato pode ficar em cada etapa antes de aparecer como atrasado. Etapas personalizadas usam o prazo da entrevista.</p><div class="grid">${BASE_ETAPAS.map(k => `<div class="fld"><label for="sl-${k}">${ETAPA[k]} (dias)</label><input class="inp" type="number" min="0" id="sl-${k}" value="${s[k]}"></div>`).join('')}</div><div class="row end"><button class="btn" id="sl-ok">Salvar prazos</button></div></section>`;
  $('#sl-ok', w).onclick = async () => { await emp(S.eid).update({ sla: Object.fromEntries(BASE_ETAPAS.map(k => [k, Math.max(0, parseInt($(`#sl-${k}`, w).value) || 0)])) }); log('Atualizou os prazos das etapas'); toast('Prazos salvos.'); };
}
/* ---------- Candidatos: retorno em lote, prazos e candidatura rápida ---------- */
function extrasCands3(el) {
  $$('.kcard', el).forEach(c => { const a = S.d.apps.find(x => x.id === c.dataset.ab); if (!a) return; const at = atrasoSLA(a);
    if (at) c.insertAdjacentHTML('beforeend', `<span class="pill bad" style="margin-top:4px">Parado +${at}d além do prazo</span>`); if (a.rapida && !((a.perfil || {}).resumo)) c.insertAdjacentHTML('beforeend', '<span class="pill warn" style="margin-top:4px">Candidatura rápida</span>');
    if (a.propostaResp) c.insertAdjacentHTML('beforeend', `<span class="pill ${a.propostaResp.status === 'aceita' ? 'ok' : 'bad'}" style="margin-top:4px">Proposta ${a.propostaResp.status}</span>`); });
  if (!S.vagaSel || !ehEditor()) return; const bar = $('.row', el); if (bar) bar.insertAdjacentHTML('beforeend', '<button class="btn sec" id="cd-lote">Retorno em lote</button>');
  const b = $('#cd-lote', el); if (b) b.onclick = () => retornoLote(vagaDe(S.vagaSel));
}
function retornoLote(v) {
  const sem = S.d.apps.filter(a => a.vagaId === v.id && etapaV(a) === 'reprovado' && !a.retornoEm), abertos = S.d.apps.filter(a => a.vagaId === v.id && !final(a));
  modal(`Retorno aos não aprovados · ${v.titulo}`, `${abertos.length && v.status === 'fechada' ? `<div class="panel" style="padding:12px 14px;border-color:var(--warn)"><p style="margin:0 0 8px">A vaga está fechada e ${abertos.length} candidato(s) continuam em andamento.</p><button class="btn bad sm" id="rl-enc">Encerrar todos como não aprovados</button></div>` : ''}
    ${sem.length ? `<p class="hint" style="margin-top:0">${sem.length} pessoa(s) ainda sem retorno. A mensagem já está no portal de cada uma; o WhatsApp é opcional.</p><ul class="list">${sem.map(a => `<li><div class="t"><div><b>${esc(a.perfil.nome)}</b></div><div>${esc(tel(a.perfil.telefone))}</div></div>${a.perfil.telefone ? `<a class="btn sec sm" data-wl="${a.id}" href="${waLink(a.perfil.telefone, msg('reprovado', { nome: primeiro(a.perfil.nome), vaga: v.titulo }))}" target="_blank" rel="noopener">WhatsApp</a>` : ''}<button class="btn ghost sm" data-ok="${a.id}">Marcar avisado</button></li>`).join('')}</ul>` : '<p class="hint">Todos os não aprovados desta vaga já receberam retorno.</p>'}`,
    { size: 'lg', onMount: m => {
      const marcar = async id => { await sub(S.eid, 'apps').doc(id).update({ retornoEm: agora() }); const li = $(`[data-ok="${id}"]`, m); if (li) li.closest('li').remove(); };
      $$('[data-wl]', m).forEach(x => x.addEventListener('click', () => setTimeout(() => marcar(x.dataset.wl), 300))); $$('[data-ok]', m).forEach(x => x.onclick = () => marcar(x.dataset.ok));
      const enc = $('#rl-enc', m); if (enc) enc.onclick = () => confirmar(`Encerrar ${abertos.length} candidatura(s) como não aprovadas e enviar a mensagem padrão pelo portal?`, async () => {
        const b = db.batch(); abertos.forEach(a => { const t = msg('reprovado', { nome: primeiro(a.perfil.nome), vaga: v.titulo }); b.update(sub(S.eid, 'apps').doc(a.id), { etapa: 'reprovado', decisao: { resultado: 'reprovado', msg: t, em: agora(), por: S.me.nome }, atualizadoEm: agora(), mensagens: [...(a.mensagens || []), { de: 'rh', t, por: S.me.nome, em: agora() }], historico: [...(a.historico || []), { t: 'Reprovado no encerramento da vaga', em: agora(), por: S.me.nome }] }); });
        await b.commit(); log(`Encerrou ${abertos.length} candidatura(s) da vaga ${v.titulo}`); toast('Candidaturas encerradas. Agora envie os retornos.'); setTimeout(() => retornoLote(v), 400); }, 'Encerrar', true); } });
}
/* ---------- Sala do recrutador: 1 a 1 ou em grupo, com transcrição ---------- */
function painelTranscricao(el, ref, ent) {
  const box = document.createElement('section'); box.style.cssText = 'margin-top:18px;border-top:1px solid var(--line);padding-top:12px';
  box.innerHTML = `<h3 style="margin-bottom:6px">Transcrição</h3>${temTranscricao() ? `<p class="hint" style="margin:0 0 8px">Pede autorização ao candidato. Cada lado transcreve o próprio microfone; no Chrome, o áudio passa pelo serviço de voz do Google.</p><button class="btn sec sm" id="tr-pedir">Pedir autorização e transcrever</button>` : '<p class="hint" style="margin:0">Use o Google Chrome para transcrever.</p>'}<div id="tr-st" class="hint" style="margin:6px 0"></div><div id="tr-l" style="max-height:220px;overflow-y:auto;font-size:13.5px"></div>`;
  $('.lado', el).appendChild(box); S.transcr = S.transcr || {}; let rec = null; const un = [];
  un.push(ref.collection('transcricao').onSnapshot(q => { const l = docs(q).sort((x, y) => x.em.localeCompare(y.em)); S.transcr[ent.id] = l.map(x => `${x.quem}: ${x.t}`); $('#tr-l', box).innerHTML = l.map(x => `<p style="margin:0 0 4px"><b>${esc(x.quem)}:</b> ${esc(x.t)}</p>`).join(''); const tl = $('#tr-l', box); tl.scrollTop = tl.scrollHeight; }));
  un.push(ref.onSnapshot(s => { const d = s.data() || {}, st = $('#tr-st', box); if (!d.transcrever) return; if (d.consentTranscr === 'negado') { st.textContent = 'O candidato não autorizou a transcrição.'; if (rec) { rec.parar(); rec = null; } }
    else if (d.consentTranscr) { st.textContent = `Autorizado pelo candidato em ${fdt(d.consentTranscr)}. Transcrevendo…`; if (!rec) rec = iniciarTranscricao(ref, primeiro(S.me.nome) + ' (RH)'); } else st.textContent = 'Aguardando a autorização do candidato…'; }));
  const p = $('#tr-pedir', box); if (p) p.onclick = async () => { await ref.set({ transcrever: true, consentTranscr: null }, { merge: true }); p.disabled = true; };
  return () => { un.forEach(u => u()); if (rec) rec.parar(); };
}
async function salvarScorecard(ent, root) {
  const rot = questDe(ent.roteiroId), crit = CRITERIOS.map((_, i) => +(($(`[name=cr${i}]:checked`, root) || {}).value || 0)), validos = crit.filter(Boolean);
  if (!validos.length) { toast('Dê nota a pelo menos um critério.', true); return false; }
  const pv = privDe(ent.appId), tr = (S.transcr || {})[ent.id] || [], av = { resp: rot ? lerRespostas(rot.perguntas, root, 'r').r : {}, criterios: crit, media: Math.round(validos.reduce((s, x) => s + x, 0) / validos.length * 10) / 10, obs: $('#sc-o', root).value.trim(), recomendacao: $('#sc-r', root).value, por: S.me.nome, em: agora(), ...(tr.length ? { transcricao: tr.slice(-400) } : {}) };
  try { await sub(S.eid, 'priv').doc(ent.appId).set({ entrevistas: { ...(pv.entrevistas || {}), [ent.id]: av } }, { merge: true }); if (ent.status === 'agendada') await sub(S.eid, 'entrevistas').doc(ent.id).update({ status: 'realizada' }); log(`Avaliou a entrevista de ${ent.candNome}`); toast(`Avaliação salva: média ${String(av.media).replace('.', ',')}.`); return true; } catch (er) { toast(msgErro(er), true); return false; }
}
function salaHost(ent) {
  if (!ent) return; const av = (privDe(ent.appId).entrevistas || {})[ent.id] || {}, a = S.d.apps.find(x => x.id === ent.appId) || { perfil: {} }, ref = sub(S.eid, 'salas').doc(ent.salaId), grupo = (ent.entrevistadores || []).length > 1;
  const lado = `<h2 style="margin-bottom:4px">${esc(ent.candNome)}</h2><p class="hint" style="margin-top:0">${esc(ent.vagaTitulo)}${a.perfil.cidade ? ` · ${esc(a.perfil.cidade)}` : ''}${grupo ? ` · com ${(ent.entrevistadores || []).map(u => esc(primeiro((S.d.users.find(x => x.id === u) || {}).nome))).join(', ')}` : ''}</p>${a.perfil.resumo ? `<details style="margin-bottom:12px"><summary>Resumo do candidato</summary><p style="white-space:pre-wrap">${esc(a.perfil.resumo)}</p></details>` : ''}${formScorecard(ent, av)}`;
  let parar = null; const aoSair = () => { if (parar) parar(); ref.set({ hostOn: false }, { merge: true }).catch(() => {}); if (S.pend) { S.pend = false; render(); } };
  const s = grupo ? abrirSalaGrupo({ ref, eu: S.user.uid, nome: S.me.nome, papel: 'rh', titulo: `Entrevista com ${ent.candNome}`, linkAlt: `https://meet.jit.si/nexum-${ent.salaId}`, lado, aoSair })
    : abrirSala({ ref, papel: 'host', titulo: `Entrevista com ${ent.candNome}`, linkAlt: `https://meet.jit.si/nexum-${ent.salaId}`, lado, aoSair });
  ref.set({ hostOn: true, hostEm: agora(), hostNome: S.me.nome }, { merge: true }).catch(() => {});
  $('#sc-ok', s.el).onclick = () => salvarScorecard(ent, s.el); parar = painelTranscricao(s.el, ref, ent); log(`Entrou na sala de entrevista com ${ent.candNome}`);
}
document.addEventListener('click', e => { const q = e.target.closest && e.target.closest('[data-vq]'); if (q) cartazVaga(vagaDe(q.dataset.vq)); });

/* ---------- Início ---------- */
if (iniciarFirebase('rs-recrutador')) auth.onAuthStateChanged(u => { if (S.criando) return; if (u) entrar(u); else { S.subs.forEach(f => f()); S.subs = []; S.me = null; telaLogin(S.avisoLogin); S.avisoLogin = null; } });
</script></body></html>
