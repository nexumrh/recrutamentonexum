.vaga-h h1{font-family:var(--f-disp);font-size:clamp(26px,7vw,34px);font-weight:800;line-height:1.08;letter-spacing:-.03em;margin:0}
.vaga-sal{font-family:var(--f-disp);font-size:22px;font-weight:700;color:var(--ok);margin:12px 0 0}
.vaga-sec{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:12px}
.vaga-sec h3{font-family:var(--f-disp);font-size:17px;font-weight:700;margin:0 0 8px}
.vaga-sec h3+p{margin-top:0}
.vaga-sec p{color:var(--ink2);line-height:1.6;margin:0 0 16px}
.vaga-sec p:last-child{margin-bottom:0}
.passos{list-style:none;padding:0;margin:4px 0 0;display:grid;gap:12px;counter-reset:p}
.passos li{display:flex;gap:12px;align-items:flex-start;counter-increment:p}
.passos li::before{content:counter(p);flex:0 0 28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:center}
.passos b{display:block;font-size:15px}.passos span{color:var(--ink2);font-size:14px}
.cta-fixa{position:sticky;bottom:0;z-index:20;background:linear-gradient(to top,var(--paper) 72%,rgba(245,246,250,0));padding:16px 0 14px;margin-top:6px;display:flex;flex-wrap:wrap;gap:8px}
.cta-fixa .btn{flex:1 1 220px;justify-content:center;padding:13px 18px;font-size:15.5px}
#bt-duv{bottom:20px}body:has(.cta-fixa) #bt-duv{bottom:150px!important}
/* ----- logo ----- */
.nxl{display:inline-flex;align-items:center;gap:calc(10px * var(--s,1));line-height:1}
.lg-n{flex:0 0 auto;filter:drop-shadow(0 4px 10px rgba(16,60,200,.25))}
.lg-t{display:flex;flex-direction:column;gap:calc(5px * var(--s,1))}
.lg-l1{display:flex;align-items:center;gap:calc(10px * var(--s,1))}
.lg-w{font-family:'Montserrat','Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;font-weight:800;font-size:calc(25px * var(--s,1));letter-spacing:-.01em}
.lg-claro .lg-w,.lg-claro .lg-rh{color:#fff}.lg-escuro .lg-w,.lg-escuro .lg-rh{color:#0E1A4A}
.lg-x{background:linear-gradient(118deg,currentColor 0 47%,#2F8CFF 47% 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lg-claro .lg-x{color:#fff}.lg-escuro .lg-x{color:#0E1A4A}
.lg-bar{width:2px;height:calc(24px * var(--s,1));background:#2F8CFF;border-radius:1px;display:block}
.lg-rh{font-family:'Montserrat','Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;font-weight:700;font-size:calc(24px * var(--s,1))}
.lg-sub{font-family:var(--f-txt);font-weight:500;font-size:calc(13px * var(--s,1));letter-spacing:.01em}
.lg-claro .lg-sub{color:rgba(255,255,255,.9)}.lg-escuro .lg-sub{color:var(--ink2)}
.topo .nxl{--s:.62}.topo .nxl span{opacity:1}.topo .lg-sub{display:none}.topo .in>div:first-child{display:flex;flex-direction:column;align-items:flex-start;gap:6px}.topo #emp-n{font-family:var(--f-disp);font-size:18px;font-weight:700;color:#fff;line-height:1.1}.sala .ctrl .btn.sec{color:#fff!important}.sala .ctrl .btn.sec:hover{background:#34406A}/* ===== Entrada do candidato em tela cheia (Portal de Recrutamento e Seleção) ===== */
#modal-root .ov:has(.rsfull){padding:0;background:#030C26;align-items:stretch}
.modal.rsfull{max-width:none;width:100%;min-height:100vh;min-height:100dvh;border-radius:0;margin:0;background:#030C26;color:#fff;box-shadow:none;position:relative;overflow:hidden}
.modal.rsfull .modal-h{display:none}.modal.rsfull .modal-b{padding:0;max-height:none;overflow:visible}
.rz-fundo{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.rz-fundo i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5}
.rz-fundo .l1{width:520px;height:520px;left:-140px;top:-160px;background:#1D4FD8;animation:rza 18s ease-in-out infinite alternate}
.rz-fundo .l2{width:480px;height:480px;left:38%;bottom:-220px;background:#0B3AA8;animation:rzb 22s ease-in-out infinite alternate}
.rz-fundo b{position:absolute;background:linear-gradient(135deg,#1E6BFF,#0A2E8C)}
.rz-fundo .a{left:-10%;top:-8%;width:30%;height:26%;clip-path:polygon(0 0,100% 0,0 100%);opacity:.6}
.rz-fundo .b{right:-6%;bottom:-6%;width:34%;height:30%;clip-path:polygon(100% 0,100% 100%,0 100%);opacity:.65;animation:rzf 16s ease-in-out infinite alternate}
.rz-fundo s{position:absolute;width:3px;height:70%;background:linear-gradient(transparent,#4FA3FF,transparent);transform:rotate(36deg);opacity:.5;animation:rzl 10s ease-in-out infinite}
.rz-fundo .s1{right:4%;top:-10%}.rz-fundo .s2{left:8%;bottom:-14%;animation-delay:3s}
@keyframes rza{to{transform:translate(90px,70px) scale(1.08)}}@keyframes rzb{to{transform:translate(-80px,-60px) scale(1.1)}}@keyframes rzf{to{transform:translate(16px,12px)}}@keyframes rzl{0%,100%{opacity:.12;translate:0 0}50%{opacity:.75;translate:-30px 40px}}
.rz{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(380px,.85fr);gap:56px;max-width:1300px;margin:0 auto;padding:48px 56px;min-height:100vh;min-height:100dvh;align-items:center}
.rz-esq{position:relative}
.rz-foto{position:absolute;left:52%;top:-10px;width:300px;aspect-ratio:186/532;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 45%,#000 80%,transparent 100%),linear-gradient(0deg,transparent 0%,#000 28%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent 0%,#000 45%,#000 80%,transparent 100%),linear-gradient(0deg,transparent 0%,#000 28%);mask-composite:intersect;overflow:hidden}
.rz-foto::before{content:"";position:absolute;inset:0;background:var(--foto) center top/cover no-repeat;animation:rzz 22s ease-in-out infinite alternate;transform-origin:50% 25%}
@keyframes rzz{to{transform:scale(1.07) translate(-4px,4px)}}
.rz-esq>*:not(.rz-foto){position:relative;z-index:1}
.rz-logo{display:inline-flex;align-items:center;gap:14px;line-height:1}
.rz-w{font-family:'Montserrat',var(--f-disp),sans-serif;font-weight:800;font-size:46px;letter-spacing:-.01em;color:#fff}
.rz-logo .lg-x{color:inherit}
.rz-bar{width:2px;height:52px;background:#2F8CFF;display:block;margin:0 4px}
.rz-rs{font-family:'Montserrat',var(--f-disp),sans-serif;font-weight:700;font-size:15px;letter-spacing:.14em;line-height:1.35;color:#fff}
.rz-tag{display:block;font-size:12px;letter-spacing:.42em;color:rgba(255,255,255,.82);margin:16px 0 0;font-weight:500}
.rz-esq h1{font-family:var(--f-disp);font-size:clamp(32px,3.4vw,48px);font-weight:500;line-height:1.08;margin:40px 0 0;color:#fff;letter-spacing:-.02em}
.rz-esq h1 b{display:block;font-weight:800;color:#2F8CFF}
.rz-traco{display:block;width:62px;height:4px;background:#2F8CFF;border-radius:2px;margin:16px 0 14px}
.rz-txt{font-size:17.5px;color:rgba(255,255,255,.88);max-width:42ch;margin:0 0 26px;line-height:1.45}
.rz-feat{display:grid;grid-template-columns:repeat(2,minmax(0,300px));gap:20px 30px}
.rz-feat div{display:flex;gap:14px;align-items:flex-start;opacity:0;animation:rzsobe .6s ease-out forwards}
.rz-feat div:nth-child(2){animation-delay:.07s}.rz-feat div:nth-child(3){animation-delay:.14s}.rz-feat div:nth-child(4){animation-delay:.21s}.rz-feat div:nth-child(5){animation-delay:.28s}.rz-feat div:nth-child(6){animation-delay:.35s}
.rz-feat .ic{flex:0 0 54px;height:54px;border:2px solid #2F7CF6;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#4F9BFF;background:rgba(31,95,232,.1)}.rz-feat .ic svg{width:28px;height:28px}
.rz-feat b{display:block;font-size:15.5px;color:#fff}.rz-feat span{font-size:13.5px;color:rgba(255,255,255,.78);line-height:1.35}
@keyframes rzsobe{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rz-card{background:linear-gradient(165deg,#FFFFFF 0%,#F1F5FC 100%);color:#0E1A4A;border-radius:22px;padding:36px 36px 28px;box-shadow:0 40px 90px rgba(0,8,40,.55);animation:rzsobe .7s .1s ease-out both}
.rz-card .rz-w{color:#0E1A4A;font-size:38px}.rz-card .rz-rs{color:#0E1A4A;font-size:12.5px}.rz-card .rz-bar{height:44px}.rz-card .rz-tag{color:#2F5BC8;font-size:10.5px;letter-spacing:.36em;margin:10px 0 0;text-align:center}
.rz-card h2{font-family:var(--f-disp);font-size:34px;font-weight:800;margin:30px 0 8px;color:#0E1A4A;letter-spacing:-.02em}
.rz-card .rz-p{color:#3B5BA8;font-size:17px;margin:0 0 22px;line-height:1.4}
.rz-in{position:relative;margin-bottom:14px}.rz-in label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.rz-in svg.ic{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:23px;height:23px;color:#2D3A64;pointer-events:none}
.rz-in .inp{height:58px;border-radius:10px;border:1.5px solid #D3DAEA;background:#fff;padding:0 52px 0 56px;font-size:16.5px;color:#0E1A4A;width:100%}
.rz-in .inp:focus{outline:0;border-color:#1F5FE8;box-shadow:0 0 0 4px rgba(31,95,232,.14)}
.rz-olho{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;background:transparent;color:#2D3A64;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.rz-card .rz-lgpd{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:#3C4566;margin:0 0 14px}.rz-card .rz-lgpd input{margin-top:3px}
.rz-card #fa .btn:not(.ghost){width:100%;height:58px;border:0;border-radius:10px;background:linear-gradient(90deg,#1F5FE8,#2B7BFF);color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 10px 24px rgba(31,95,232,.35)}
.rz-card #fa .btn svg{width:22px;height:22px}
.rz-card #fa .btn.ghost{display:block;margin:16px auto 0;background:none;border:0;color:#1F5FE8;font-weight:700;text-decoration:underline;font-size:15.5px;width:auto;height:auto}
.rz-alt{text-align:center;margin:12px 0 0;font-size:14.5px;color:#4A5578}.rz-alt button{background:none;border:0;padding:0;color:#1F5FE8;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.rz-seg{display:flex;gap:14px;align-items:flex-start;border-top:1px solid #DCE2EF;margin-top:22px;padding-top:18px;color:#3B5BA8;font-size:13.5px;line-height:1.45}.rz-seg b{display:block;color:#2D3A64}
.rz-seg svg{flex:0 0 32px;width:32px;height:32px;color:#2D3A64}
.rz-volta{position:absolute;top:18px;right:22px;z-index:3;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.rz-volta:hover{background:rgba(255,255,255,.18)}
@media (max-width:1000px){.rz{grid-template-columns:1fr;gap:22px;padding:56px 18px 28px}.rz-feat,.rz-foto{display:none}.rz-w{font-size:34px}.rz-rs{font-size:12px}.rz-bar{height:40px}.rz-tag{font-size:10px;letter-spacing:.3em}.rz-esq h1{font-size:28px;margin-top:22px}.rz-txt{font-size:15.5px;margin-bottom:0}.rz-card{padding:26px 22px 22px}.rz-card>.rz-logo,.rz-card>.rz-tag{display:none}.rz-card h2{margin-top:0;font-size:28px}}
@media (prefers-reduced-motion:reduce){.modal.rsfull *{animation:none!important}.rz-feat div{opacity:1}}

/* acabamento igual ao da tela do recrutador */
.modal.rsfull{background:radial-gradient(120% 90% at 18% 30%,#0B2E86 0%,#061846 38%,#030B24 72%)}
.rz-foto{left:auto;right:-40px;top:-50px;width:240px;-webkit-mask-image:radial-gradient(ellipse 50% 42% at 52% 47%,#000 46%,transparent 100%)!important;mask-image:radial-gradient(ellipse 50% 42% at 52% 47%,#000 46%,transparent 100%)!important;-webkit-mask-composite:source-over!important;mask-composite:add!important}
.rz-foto::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,90,220,.10),rgba(3,12,38,.30));mix-blend-mode:multiply}
.rz-esq h1 b{background:linear-gradient(90deg,#3D8BFF,#7FB8FF);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.rz-card{position:relative;overflow:hidden}.rz-card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#1F5FE8,#36A3FF,#1F5FE8)}
.rz-card .rz-in .inp{background:#F6F8FC;border:1px solid #E2E7F1;border-radius:12px}.rz-card .rz-in .inp:focus{background:#fff}
.rz-card #fa .btn:not(.ghost){border-radius:12px;background:linear-gradient(180deg,#2A6BF2,#1A52D6)}
.rz-card #fa .btn.ghost{text-decoration:none;font-weight:600}.rz-card #fa .btn.ghost:hover{text-decoration:underline}
.rz-card .rz-alt button{text-decoration:none}.rz-card .rz-alt button:hover{text-decoration:underline}
.rz-lgpd{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:#4A5578;margin:0 0 14px}.rz-lgpd input{margin-top:3px}

<script>/* =====================================================================
   NEXUM Recrutamento e Seleção — núcleo compartilhado (recrutador e candidato)
   1) Crie um projeto novo em console.firebase.google.com
   2) Ative Authentication > E-mail/senha e o Firestore Database
   3) Em Configurações do projeto > Seus apps > Web, copie a configuração e cole abaixo
   4) Publique as regras do arquivo rs_firestore.rules
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyAlR1Iv8em7-K8yn8qHdKvq4n46wKSTiug',
  authDomain: 'recrutamento-bed5d.firebaseapp.com',
  projectId: 'recrutamento-bed5d',
  storageBucket: 'recrutamento-bed5d.firebasestorage.app',
  messagingSenderId: '587424133454',
  appId: '1:587424133454:web:d00f550ff7d9bfb2aaae1f'
};
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const uid = (n = 16) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join('');
const iso = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const agora = () => new Date().toISOString();
const pd = s => { if (!s) return null; const [a, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(a, m - 1, d); };
const addD = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const diffD = (a, b) => Math.round((pd(iso(b)) - pd(iso(a))) / 864e5);
const fd = s => s ? new Date(s.length > 10 ? s : s + 'T12:00').toLocaleDateString('pt-BR') : '—';
const fdt = s => s ? new Date(s).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
