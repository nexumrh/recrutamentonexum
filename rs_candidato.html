      <details ${(a.mensagens || []).some(m => m.de === 'rh' && (!a.vistoEm || m.em > a.vistoEm)) ? 'open' : ''} data-ms="${a.id}"><summary>Mensagens${(a.mensagens || []).length ? ` (${a.mensagens.length})` : ''}</summary><div class="msgs" style="margin-top:10px">${(a.mensagens || []).map(m => `<div class="msg ${m.de === 'cand' ? 'eu' : ''}">${esc(m.t)}<small>${m.de === 'rh' ? esc(P.emp.nome || 'RH') : 'Você'} · ${fdt(m.em)}</small></div>`).join('') || '<p class="hint">Nenhuma mensagem ainda.</p>'}</div>
        ${final(et) ? '' : `<div class="row" style="margin-top:8px;flex-wrap:nowrap"><input class="inp" data-mt="${a.id}" placeholder="Escreva para o RH" maxlength="1000"><button class="btn sec" data-me="${a.id}">Enviar</button></div>`}</details>
      ${final(et) ? '' : `<div class="row end" style="margin-top:10px"><button class="btn ghost sm" data-ds="${a.id}" style="color:var(--bad)">Desistir desta vaga</button></div>`}</article>`; }).join('')
    : '<div class="panel empty"><b>Você ainda não se candidatou</b>Escolha uma vaga para começar.<div style="margin-top:12px"><button class="btn" id="mn-v">Ver vagas</button></div></div>';
  const mv = $('#mn-v', el); if (mv) mv.onclick = () => go('vagas');
  const app = id => P.apps.find(a => a.id === id), up = (id, d) => sub(EID, 'apps').doc(id).update(d).catch(er => { toast(msgErro(er), true); throw er; });
  $$('[data-te]', el).forEach(b => b.onclick = () => { const [aid, tid] = b.dataset.te.split('|'); responderTeste(app(aid), tid); });
  $$('[data-cf]', el).forEach(b => b.onclick = async () => { const [aid, eid] = b.dataset.cf.split('|'), a = app(aid); await up(aid, { confirmacoes: { ...(a.confirmacoes || {}), [eid]: agora() } }); toast('Presença confirmada.'); });
  $$('[data-sl]', el).forEach(b => b.onclick = () => salaGuest(P.ents.find(e => e.id === b.dataset.sl)));
  $$('[data-me]', el).forEach(b => b.onclick = async () => { const a = app(b.dataset.me), i = $(`[data-mt="${a.id}"]`, el), t = i.value.trim(); if (!t) return; await up(a.id, { mensagens: [...(a.mensagens || []), { de: 'cand', t, em: agora() }], vistoEm: agora() }); toast('Mensagem enviada ao RH.'); });
  $$('[data-ms]', el).forEach(d => d.addEventListener('toggle', () => { const a = app(d.dataset.ms); if (d.open && (a.mensagens || []).some(m => m.de === 'rh' && (!a.vistoEm || m.em > a.vistoEm))) up(a.id, { vistoEm: agora() }); }));
  $$('[data-ds]', el).forEach(b => b.onclick = () => confirmar('Desistir desta vaga? O RH será avisado e o processo será encerrado para você.', async () => { await up(b.dataset.ds, { desistiu: agora() }); toast('Candidatura encerrada.'); }, 'Desistir', true));
}
const final = et => ['aprovado', 'reprovado', 'desistiu'].includes(et);
function responderTeste(a, tid) {
  const idx = (a.testes || []).findIndex(t => t.id === tid), t = a.testes[idx]; if (!t) return;
  const comecar = async () => { if (!t.iniciadoEm) { t.iniciadoEm = agora(); const ts = a.testes.slice(); ts[idx] = { ...t }; await sub(EID, 'apps').doc(a.id).update({ testes: ts }); } abrir(); };
  const abrir = () => { const fim = t.tempoMin ? new Date(t.iniciadoEm).getTime() + t.tempoMin * 60000 : 0; let tm = null;
    const m = modal(t.titulo, `${t.instrucoes ? `<p class="hint" style="margin-top:0">${esc(t.instrucoes)}</p>` : ''}${t.tempoMin ? '<div class="crono" id="tt-c" aria-live="polite"></div>' : ''}${t.perguntas.map((q, i) => campoPergunta(q, i, (t.rascunho || {})[q.id])).join('')}`,
      { size: 'lg', foot: '<button class="btn" id="tt-ok">Enviar respostas</button>', onMount: mm => {
        const enviar = async (forcado) => { const rr = lerRespostas(t.perguntas, mm); if (!forcado && rr.falta.length) return toast(`Responda a pergunta ${rr.falta[0]}.`, true); clearInterval(tm);
          const ts = a.testes.slice(); ts[idx] = { ...t, respostas: rr.r, respondidoEm: agora(), ...(forcado ? { tempoEsgotado: true } : {}) };
          try { await sub(EID, 'apps').doc(a.id).update({ testes: ts }); closeModal(); toast(forcado ? 'O tempo acabou. Enviamos as respostas que você marcou.' : 'Respostas enviadas. Boa sorte!'); } catch (er) { toast(msgErro(er), true); } };
        $('#tt-ok', mm).onclick = () => enviar(false);
        if (fim) { const tick = () => { const r = Math.max(0, fim - Date.now()), c = $('#tt-c', mm); if (!c) return clearInterval(tm); c.textContent = `Tempo restante: ${Math.floor(r / 60000)}:${String(Math.floor(r / 1000) % 60).padStart(2, '0')}`; c.classList.toggle('fim', r < 60000); if (!r) enviar(true); }; tick(); tm = setInterval(tick, 1000); } } }); };
  if (t.iniciadoEm || !t.tempoMin) return t.iniciadoEm ? abrir() : comecar();
  modal('Antes de começar', `<p style="margin-top:0">Este teste tem <b>${t.tempoMin} minutos</b> e ${t.perguntas.length} perguntas. O tempo começa a contar quando você clicar em Começar e continua mesmo se fechar a janela.</p>`, { size: 'sm', foot: '<button class="btn sec" data-close>Depois</button><button class="btn" id="tt-go">Começar</button>', onMount: m => $('#tt-go', m).onclick = () => { closeModal(); comecar(); } });
}
function salaGuest(e) {
  if (!e) return;
  abrirSala({ ref: sub(EID, 'salas').doc(e.salaId), papel: 'guest', titulo: `Entrevista: ${e.vagaTitulo}`, linkAlt: `https://meet.jit.si/nexum-${e.salaId}`,
    lado: `<h2 style="margin-bottom:6px">Entrevista para ${esc(e.vagaTitulo)}</h2><p class="hint" style="margin-top:0">${esc(P.emp.nome || '')}</p><h3 style="margin:14px 0 6px">Dicas</h3><ul style="padding-left:18px;line-height:1.7;margin:0"><li>Fique num lugar silencioso e com luz de frente.</li><li>Use fone de ouvido, se tiver.</li><li>Deixe o celular apoiado, na altura dos olhos.</li><li>Se a imagem não aparecer em 1 minuto, use o link alternativo.</li></ul>` });
}
/* ---------- Perfil ---------- */
function vPerfil(el) {
  const p = P.perfil || {};
  el.innerHTML = `<section class="panel"><div class="row"><h2 style="flex:1">${esc(p.nome || 'Meu perfil')}</h2><button class="btn" id="pf-e">Editar perfil</button></div><p class="hint">${esc(p.email || '')} · ${esc(tel(p.telefone)) || 'sem telefone'} · ${esc(p.cidade || 'sem cidade')}</p>
    ${p.resumo ? `<p style="white-space:pre-wrap">${esc(p.resumo)}</p>` : ''}${(p.experiencias || []).length ? `<h3 style="margin-top:14px">Experiência</h3><ul class="list">${p.experiencias.map(x => `<li><div class="t"><div><b>${esc(x.cargo)}</b>, ${esc(x.empresa)}</div><div>${esc(x.periodo || '')}</div></div></li>`).join('')}</ul>` : ''}
    ${(p.habilidades || []).length ? `<div class="row" style="gap:6px;margin-top:10px">${p.habilidades.map(h => `<span class="pill">${esc(h)}</span>`).join('')}</div>` : ''}<p class="hint" style="margin-top:12px">${p.curriculo ? `Currículo: ${esc(p.curriculo.nome)}` : 'Sem currículo anexado.'}</p></section>
    <section class="panel"><h2 style="margin-bottom:8px">Conta e privacidade</h2><div class="row"><button class="btn sec" id="pf-s">Trocar senha</button><button class="btn sec" id="pf-d">Baixar meus dados</button><button class="btn ghost" id="pf-x" style="color:var(--bad)">Excluir minha conta</button></div><p class="note">Pela LGPD, você pode receber uma cópia dos seus dados ou excluir sua conta e suas candidaturas a qualquer momento.</p></section>`;
  $('#pf-e', el).onclick = () => editarPerfil();
  $('#pf-s', el).onclick = async () => { try { await auth.sendPasswordResetEmail(P.user.email); toast(`Enviamos um link para ${P.user.email}.`); } catch (er) { toast(msgErro(er), true); } };
  $('#pf-d', el).onclick = () => { const d = { perfil: { ...P.perfil, curriculo: P.perfil.curriculo ? '[arquivo anexado]' : null }, candidaturas: P.apps.map(a => ({ vaga: a.vagaTitulo, etapa: etapaC(a), inscricao: a.criadoEm, triagem: a.triagem, testes: a.testes, mensagens: a.mensagens, resultado: a.decisao })), entrevistas: P.ents.map(e => ({ vaga: e.vagaTitulo, inicio: e.inicio, tipo: e.tipo, status: e.status })), geradoEm: agora() };
    const u = URL.createObjectURL(new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' })), a = document.createElement('a'); a.href = u; a.download = 'meus_dados.json'; a.click(); setTimeout(() => URL.revokeObjectURL(u), 1500); };
  $('#pf-x', el).onclick = () => modal('Excluir minha conta', `<p style="margin-top:0">Vamos apagar seu perfil e suas ${P.apps.length} candidatura(s) nesta empresa. Isso não pode ser desfeito.</p><div class="fld"><label for="x-s">Digite sua senha para confirmar</label><input class="inp" type="password" id="x-s" autocomplete="current-password"></div>`, { size: 'sm', foot: '<button class="btn sec" data-close>Cancelar</button><button class="btn bad" id="x-ok">Excluir tudo</button>', onMount: m => $('#x-ok', m).onclick = async () => {
    try { await auth.signInWithEmailAndPassword(P.user.email, $('#x-s', m).value); const u = auth.currentUser; P.subs.forEach(f => f()); P.subs = [];
      for (const a of P.apps) await sub(EID, 'apps').doc(a.id).delete(); await db.doc(`candidatos/${u.uid}`).delete(); await u.delete(); closeModal(); toast('Conta excluída.'); } catch (er) { toast(msgErro(er), true); } } });
}
function editarPerfil(depois, aviso) {
  const p = JSON.parse(JSON.stringify(P.perfil || {})), ex = p.experiencias || [], fo = p.formacao || [];
  const linhaEx = (x, i) => `<div class="perg" data-ex="${i}"><div class="grid"><div class="fld"><label>Cargo</label><input class="inp" data-k="cargo" value="${esc(x.cargo || '')}"></div><div class="fld"><label>Empresa</label><input class="inp" data-k="empresa" value="${esc(x.empresa || '')}"></div><div class="fld"><label>Período</label><input class="inp" data-k="periodo" value="${esc(x.periodo || '')}" placeholder="Ex.: 2023 a 2025"></div><div class="fld full"><label>O que fazia</label><input class="inp" data-k="atividades" value="${esc(x.atividades || '')}"></div></div><button type="button" class="btn ghost sm" data-rx="${i}" style="color:var(--bad)">Remover</button></div>`;
  const linhaFo = (x, i) => `<div class="perg" data-fo="${i}"><div class="grid"><div class="fld"><label>Curso</label><input class="inp" data-k="curso" value="${esc(x.curso || '')}" placeholder="Ex.: Ensino médio, Administração"></div><div class="fld"><label>Instituição</label><input class="inp" data-k="instituicao" value="${esc(x.instituicao || '')}"></div><div class="fld"><label>Situação</label><select class="inp" data-k="situacao">${opts(['Concluído', 'Cursando', 'Trancado'].map(s => [s, s]), x.situacao || 'Concluído')}</select></div></div><button type="button" class="btn ghost sm" data-rf="${i}" style="color:var(--bad)">Remover</button></div>`;
  modal('Meu perfil', `${aviso ? `<p class="aviso">${esc(aviso)}</p>` : ''}<div class="grid"><div class="fld"><label for="pf-n">Nome completo</label><input class="inp" id="pf-n" value="${esc(p.nome || '')}" autocomplete="name"></div><div class="fld"><label for="pf-t">WhatsApp</label><input class="inp" id="pf-t" type="tel" value="${esc(tel(p.telefone))}" placeholder="(45) 99999-9999" autocomplete="tel"></div><div class="fld"><label for="pf-c">Cidade</label><input class="inp" id="pf-c" value="${esc(p.cidade || '')}"></div><div class="fld"><label for="pf-l">LinkedIn ou portfólio (opcional)</label><input class="inp" id="pf-l" value="${esc(p.link || '')}"></div>
    <div class="fld full"><label for="pf-r">Fale um pouco sobre você e sua experiência</label><textarea class="inp" id="pf-r" maxlength="2000">${esc(p.resumo || '')}</textarea></div><div class="fld full"><label for="pf-h">Habilidades (separe por vírgula)</label><input class="inp" id="pf-h" value="${esc((p.habilidades || []).join(', '))}" placeholder="Ex.: vendas, atendimento, Excel, espanhol"></div></div>
    <h3 style="margin:6px 0 8px">Experiência</h3><div id="pf-ex"></div><button type="button" class="btn sec sm" id="pf-ax">Adicionar experiência</button><h3 style="margin:16px 0 8px">Formação</h3><div id="pf-fo"></div><button type="button" class="btn sec sm" id="pf-af">Adicionar formação</button>
    <div class="fld" style="margin-top:16px"><label for="pf-cv">Currículo em PDF ou foto ${p.curriculo ? `<span class="hint">(atual: ${esc(p.curriculo.nome)})</span>` : '(opcional)'}</label><input class="inp" type="file" id="pf-cv" accept="application/pdf,image/*"></div>`,
    { size: 'lg', foot: '<button class="btn sec" data-close>Cancelar</button><button class="btn" id="pf-ok">Salvar perfil</button>', onMount: m => {
      const ler = () => { $$('[data-ex]', m).forEach(b => $$('[data-k]', b).forEach(i => ex[+b.dataset.ex][i.dataset.k] = i.value.trim())); $$('[data-fo]', m).forEach(b => $$('[data-k]', b).forEach(i => fo[+b.dataset.fo][i.dataset.k] = i.value.trim())); };
      const des = () => { $('#pf-ex', m).innerHTML = ex.map(linhaEx).join(''); $('#pf-fo', m).innerHTML = fo.map(linhaFo).join(''); $$('[data-rx]', m).forEach(b => b.onclick = () => { ler(); ex.splice(+b.dataset.rx, 1); des(); }); $$('[data-rf]', m).forEach(b => b.onclick = () => { ler(); fo.splice(+b.dataset.rf, 1); des(); }); };
      $('#pf-ax', m).onclick = () => { ler(); ex.push({}); des(); }; $('#pf-af', m).onclick = () => { ler(); fo.push({}); des(); }; des();
      $('#pf-ok', m).onclick = async () => { ler(); const d = { ...p, nome: $('#pf-n', m).value.trim(), telefone: $('#pf-t', m).value.replace(/\D/g, ''), cidade: $('#pf-c', m).value.trim(), link: $('#pf-l', m).value.trim(), resumo: $('#pf-r', m).value.trim(), habilidades: $('#pf-h', m).value.split(',').map(x => x.trim()).filter(Boolean).slice(0, 20), experiencias: ex.filter(x => x.cargo || x.empresa), formacao: fo.filter(x => x.curso), atualizadoEm: agora() };
        if (d.nome.split(/\s+/).length < 2) return toast('Informe seu nome completo.', true); if (d.telefone.length < 10) return toast('Informe o WhatsApp com DDD.', true); if (!d.cidade) return toast('Informe sua cidade.', true);
        if (d.link && !/^https?:\/\//.test(d.link)) d.link = 'https://' + d.link;
        const f = $('#pf-cv', m).files[0]; if (f) { try { d.curriculo = await lerArquivo(f); } catch (er) { return toast(er.message, true); } }
        if (!d.resumo && !d.curriculo && !d.experiencias.length) return toast('Escreva um pouco sobre você, adicione uma experiência ou anexe o currículo.', true);
        const b = $('#pf-ok', m); b.disabled = true;
        try { await db.doc(`candidatos/${P.user.uid}`).set(d); P.perfil = d; const pub = { ...d }; delete pub.lgpd; delete pub.criadoEm;
          for (const a of P.apps.filter(a => !final(etapaC(a)))) await sub(EID, 'apps').doc(a.id).update({ perfil: pub }).catch(() => {});
          closeModal(); toast('Perfil salvo.'); render(); if (depois) setTimeout(depois, 150); } catch (er) { b.disabled = false; toast(msgErro(er), true); } }; } });
}
/* ---------- Início ---------- */
if (iniciarFirebase('rs-candidato')) {
  base();
  if (!EID) { $('#view').innerHTML = '<div class="panel empty"><b>Abra pelo link da empresa</b>Este portal é aberto pelo link de vagas divulgado pela empresa.</div>'; }
  else {
    emp(EID).get().then(s => { if (!s.exists) { $('#view').innerHTML = '<div class="panel empty"><b>Empresa não encontrada</b>Confira o link recebido.</div>'; return; } P.emp = s.data(); $('#emp-n').textContent = P.emp.nome; document.title = `Vagas · ${P.emp.nome}`;
      sub(EID, 'vagas').where('status', '==', 'aberta').onSnapshot(q => { P.vagas = docs(q); rerender(); }, er => toast(msgErro(er), true));
      auth.onAuthStateChanged(u => { if (u) aoEntrar(u); else { P.user = null; P.perfil = null; P.apps = []; P.ents = []; P.subs.forEach(f => f()); P.subs = []; if (['minhas', 'perfil'].includes(P.view)) P.view = 'vagas'; render(); } });
    }).catch(er => { $('#view').innerHTML = `<div class="panel empty"><b>Não foi possível abrir</b>${esc(msgErro(er))}</div>`; });
  }
}
</script></body></html>
