function respostaDuvida(txt) {
  const t = ' ' + String(txt).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase() + ' ', tem = (...w) => w.some(x => t.includes(x)), ap = P.apps.slice().sort((a, b) => (b.atualizadoEm || '').localeCompare(a.atualizadoEm || ''))[0];
  if (tem('resultado', 'aprovad', 'retorno', 'quando sai', 'status', 'andamento')) return !P.user ? 'Entre na sua conta e abra "Minhas candidaturas": lá aparece a etapa de cada vaga e o resultado.' : ap ? `Sua candidatura mais recente (${ap.vagaTitulo}) está na etapa "${ETAPA[etapaC(ap)] || ap.etapaRot || ap.etapa}". O resultado aparece em "Minhas candidaturas" assim que o RH decidir.` : 'Você ainda não se candidatou. Escolha uma vaga em "Vagas".';
  if (tem('entrevista', 'sala', 'video', 'camera', 'chamada')) return 'Em "Minhas candidaturas" aparece a data da entrevista. Quando o entrevistador abrir a sala, o botão "Entrar na sala" libera e você recebe um aviso. Use o celular apoiado, em lugar silencioso, e autorize câmera e microfone.';
  if (tem('senha', 'login', 'entrar', 'acesso')) return ehAnonimo() ? 'Você fez a candidatura rápida. Crie uma senha em "Meu perfil" para entrar de qualquer aparelho.' : 'Na tela de entrada, use "Já tenho conta" e "Esqueci minha senha": enviamos um link para o seu e-mail.';
  if (tem('teste', 'prova', 'tempo', 'cronometro')) return 'Os testes aparecem em "Minhas candidaturas". Se tiver tempo limite, o relógio começa quando você clica em "Começar" e continua mesmo se fechar a janela.';
  if (tem('documento', 'curriculo', 'cpf', 'rg', 'carteira')) return 'O currículo vai no seu perfil. Documentos pessoais (RG, CPF, carteira de trabalho) só são pedidos se você for aprovado, junto com a carta-proposta.';
  if (tem('desist', 'cancelar', 'nao quero')) return 'Em "Minhas candidaturas", use "Desistir desta vaga". Para apagar todos os seus dados, vá em "Meu perfil" e "Excluir minha conta".';
  if (tem('salario', 'beneficio', 'horario', 'onde fica', 'endereco')) return 'As informações de salário, horário e local ficam na página de cada vaga. Os detalhes finais vêm na carta-proposta, se você for aprovado.';
  if (tem('dados', 'lgpd', 'privacidade', 'apagar')) return 'Em "Meu perfil" você pode baixar uma cópia dos seus dados ou excluir sua conta a qualquer momento.';
  return null;
}
function botaoDuvidas() {
  if ($('#bt-duv')) return; document.body.insertAdjacentHTML('beforeend', '<button id="bt-duv" class="btn" style="position:fixed;right:16px;bottom:16px;z-index:40;border-radius:999px;box-shadow:0 8px 24px rgba(20,32,61,.25)">Dúvidas?</button>');
  $('#bt-duv').onclick = () => { const hist = []; modal('Tira-dúvidas', `<div class="msgs" id="du-m"><div class="msg">Olá! Pergunte sobre resultado, entrevista, testes, senha, documentos ou seus dados.</div></div><div class="row" style="margin-top:10px;flex-wrap:nowrap"><input class="inp" id="du-t" placeholder="Escreva sua dúvida" maxlength="300"><button class="btn" id="du-ok">Enviar</button></div>
    <div class="row" style="margin-top:8px;gap:6px">${['Quando sai o resultado?', 'Como entro na entrevista?', 'Esqueci a senha'].map(q => `<button class="btn ghost sm" data-dq="${q}">${q}</button>`).join('')}</div>`, { size: 'sm', onMount: m => {
      const env = q => { if (!q) return; const r = respostaDuvida(q) || (P.user && P.apps.length ? 'Não sei responder isso. Abra "Minhas candidaturas" e mande uma mensagem ao RH pela sua candidatura.' : 'Não sei responder isso. Se já se candidatou, mande uma mensagem ao RH pela sua candidatura.');
        $('#du-m', m).insertAdjacentHTML('beforeend', `<div class="msg eu">${esc(q)}</div><div class="msg">${esc(r)}</div>`); const b = $('#du-m', m); b.scrollTop = b.scrollHeight; $('#du-t', m).value = ''; };
      $('#du-ok', m).onclick = () => env($('#du-t', m).value.trim()); $('#du-t', m).onkeydown = e => { if (e.key === 'Enter') env(e.target.value.trim()); }; $$('[data-dq]', m).forEach(b => b.onclick = () => env(b.dataset.dq)); } }); };
}
/* ---------- Referências profissionais ---------- */
function editarReferencias() {
  const l = JSON.parse(JSON.stringify((P.perfil || {}).referencias || []));
  const des = m => { $('#rf-l', m).innerHTML = l.map((r, i) => `<div class="perg" data-ri="${i}"><div class="grid"><div class="fld"><label>Nome</label><input class="inp" data-k="nome" value="${esc(r.nome || '')}"></div><div class="fld"><label>Telefone</label><input class="inp" type="tel" data-k="telefone" value="${esc(tel(r.telefone))}"></div><div class="fld"><label>Empresa</label><input class="inp" data-k="empresa" value="${esc(r.empresa || '')}"></div><div class="fld"><label>Cargo dessa pessoa</label><input class="inp" data-k="cargo" value="${esc(r.cargo || '')}"></div><div class="fld full"><label>Relação</label><select class="inp" data-k="relacao">${opts(['Ex-chefe', 'Ex-colega', 'Cliente', 'Professor(a)', 'Outro'].map(x => [x, x]), r.relacao || 'Ex-chefe')}</select></div></div><button type="button" class="btn ghost sm" data-rr="${i}" style="color:var(--bad)">Remover</button></div>`).join('') || '<p class="hint">Nenhuma referência.</p>'; $$('[data-rr]', m).forEach(b => b.onclick = () => { ler(m); l.splice(+b.dataset.rr, 1); des(m); }); };
  const ler = m => $$('[data-ri]', m).forEach(b => $$('[data-k]', b).forEach(i => l[+b.dataset.ri][i.dataset.k] = i.value.trim()));
  modal('Referências profissionais', `<p class="hint" style="margin-top:0">Pessoas que podem falar do seu trabalho. Avise-as antes: o RH pode entrar em contato.</p><div id="rf-l"></div><button type="button" class="btn sec sm" id="rf-n">Adicionar referência</button>`,
    { foot: '<button class="btn sec" data-close>Cancelar</button><button class="btn" id="rf-ok">Salvar</button>', onMount: m => { des(m); $('#rf-n', m).onclick = () => { ler(m); if (l.length >= 4) return toast('Até 4 referências.', true); l.push({ relacao: 'Ex-chefe' }); des(m); };
      $('#rf-ok', m).onclick = async () => { ler(m); const ok = l.filter(r => r.nome && r.telefone).map(r => ({ ...r, telefone: r.telefone.replace(/\D/g, '') })); if (ok.some(r => r.telefone.length < 10)) return toast('Confira os telefones (com DDD).', true);
        try { await db.doc(`candidatos/${P.user.uid}`).set({ referencias: ok }, { merge: true }); P.perfil.referencias = ok; for (const a of P.apps.filter(a => !final(etapaC(a)))) await sub(EID, 'apps').doc(a.id).update({ perfil: { ...a.perfil, referencias: ok } }).catch(() => {}); closeModal(); toast('Referências salvas.'); render(); } catch (er) { toast(msgErro(er), true); } }; } });
}
/* ---------- Carta-proposta ---------- */
const cpfOk = c => { c = String(c || '').replace(/\D/g, ''); if (c.length !== 11 || /^(\d)\1+$/.test(c)) return false; const dv = n => { let s = 0; for (let i = 0; i < n; i++) s += +c[i] * (n + 1 - i); const r = s * 10 % 11; return r === 10 ? 0 : r; }; return dv(9) === +c[9] && dv(10) === +c[10]; };
function blocoProposta(a) {
  const pr = a.proposta, r = a.propostaResp; if (!pr) return ''; const docsOk = new Set(a.docsRecebidos || []);
  return `<div class="aviso ok" style="background:#EEF2FF"><b>Carta-proposta de trabalho</b><p style="margin:6px 0;line-height:1.7"><b>Cargo:</b> ${esc(pr.cargo)}<br><b>Salário:</b> R$ ${(+pr.salario).toLocaleString('pt-BR', { minimumFractionDigits: 2 })} por mês<br><b>Contrato:</b> ${esc(pr.contrato)}<br><b>Início:</b> ${fd(pr.inicio)}${pr.horario ? `<br><b>Horário:</b> ${esc(pr.horario)}` : ''}${pr.local ? `<br><b>Local:</b> ${esc(pr.local)}` : ''}${pr.beneficios ? `<br><b>Benefícios:</b> ${esc(pr.beneficios)}` : ''}${pr.exame && pr.exame.data ? `<br><b>Exame admissional:</b> ${fd(pr.exame.data)}${pr.exame.clinica ? `, ${esc(pr.exame.clinica)}` : ''}` : ''}</p>
    ${!r ? `<p class="hint" style="margin:0 0 8px">Responda até ${fd(pr.validade)}.</p><div class="row"><button class="btn ok" data-pa="${a.id}">Aceitar a proposta</button><button class="btn sec" data-pr="${a.id}">Recusar</button></div>`
      : r.status === 'recusada' ? `<p style="margin:0">Você recusou esta proposta.</p>` : `<p style="margin:0 0 8px"><b>Aceita em ${fd(r.em)}.</b> Envie os documentos abaixo por foto:</p>${(pr.docs || []).map((d, i) => `<div class="row" style="padding:6px 0;border-top:1px solid var(--line2)"><span style="flex:1">${docsOk.has(i) ? '✓ ' : ''}${esc(d)}</span><label class="btn ${docsOk.has(i) ? 'ghost' : 'sec'} sm" style="cursor:pointer">${docsOk.has(i) ? 'Trocar' : 'Enviar foto'}<input type="file" accept="image/*,application/pdf" data-pdoc="${a.id}|${i}" style="display:none"></label></div>`).join('')}`}</div>`;
}
function aceitarProposta(a) {
  modal('Aceitar a proposta', `<div class="fld"><label for="ap-n">Nome completo (vale como assinatura)</label><input class="inp" id="ap-n" value="${esc(P.perfil.nome || '')}"></div><div class="fld"><label for="ap-c">CPF</label><input class="inp" id="ap-c" inputmode="numeric"></div><div class="fld"><label for="ap-p">Chave PIX ou banco, agência e conta para o salário</label><input class="inp" id="ap-p"></div>
    <label class="row hint" style="gap:8px;align-items:flex-start"><input type="checkbox" id="ap-l" style="margin-top:4px"> <span>Li e aceito a proposta. Autorizo o uso dos meus dados e documentos para a admissão (LGPD, art. 7º, V).</span></label>`,
    { size: 'sm', foot: '<button class="btn sec" data-close>Cancelar</button><button class="btn ok" id="ap-ok">Aceitar</button>', onMount: m => $('#ap-ok', m).onclick = async () => { const n = $('#ap-n', m).value.trim(), c = $('#ap-c', m).value.replace(/\D/g, '');
      if (n.split(/\s+/).length < 2) return toast('Digite seu nome completo.', true); if (!cpfOk(c)) return toast('CPF inválido.', true); if (!$('#ap-l', m).checked) return toast('Marque que leu e aceita a proposta.', true);
      try { await sub(EID, 'apps').doc(a.id).update({ propostaResp: { status: 'aceita', nome: n, cpf: `${c.slice(0, 3)}.${c.slice(3, 6)}.${c.slice(6, 9)}-${c.slice(9)}`, pix: $('#ap-p', m).value.trim().slice(0, 160), em: agora(), navegador: navigator.userAgent.slice(0, 120) }, mensagens: [...(a.mensagens || []), { de: 'cand', t: 'Aceitei a carta-proposta.', em: agora() }] }); closeModal(); toast('Proposta aceita! Agora envie os documentos.'); } catch (er) { toast(msgErro(er), true); } } });
}
document.addEventListener('click', e => { const t = e.target.closest && e.target.closest('[data-pa],[data-pr],[data-rap],[data-refs],[data-cs],[data-sl2]'); if (!t) return; const a = P.apps.find(x => x.id === (t.dataset.pa || t.dataset.pr));
  if (t.dataset.pa) aceitarProposta(a); else if (t.dataset.pr) { const mt = prompt('Se quiser, conte o motivo da recusa:'); if (mt === null) return; sub(EID, 'apps').doc(a.id).update({ propostaResp: { status: 'recusada', motivo: String(mt).slice(0, 300), em: agora() } }).then(() => toast('Resposta enviada ao RH.')).catch(er => toast(msgErro(er), true)); }
  else if (t.dataset.rap) { const v = P.vagas.find(x => x.id === P.vaga); if (v) candidaturaRapida(v); } else if (t.dataset.refs) editarReferencias(); else if (t.dataset.cs) criarSenha(); else if (t.dataset.sl2) salaGuest(P.ents.find(x => x.id === t.dataset.sl2)); });
document.addEventListener('change', async e => { const i = e.target.closest && e.target.closest('[data-pdoc]'); if (!i || !i.files[0]) return; const [aid, k] = i.dataset.pdoc.split('|'), a = P.apps.find(x => x.id === aid);
  try { const f = await lerArquivo(i.files[0]); await sub(EID, 'docsAdm').doc(`${aid}_${k}`).set({ appId: aid, candUid: P.user.uid, item: +k, nome: f.nome, tipo: f.tipo, data: f.data, em: agora() });
    await sub(EID, 'apps').doc(aid).update({ docsRecebidos: [...new Set([...(a.docsRecebidos || []), +k])] }); toast('Documento enviado ao RH.'); } catch (er) { toast(er.message || msgErro(er), true); } });
/* ---------- Sala: liberação quando o entrevistador entra ---------- */
P.salaOn = P.salaOn || {}; const _salaSubs = {};
function vigiarSalas() {
  P.ents.filter(e => e.salaId && e.status === 'agendada').forEach(e => { if (_salaSubs[e.salaId]) return;
    _salaSubs[e.salaId] = sub(EID, 'salas').doc(e.salaId).onSnapshot(s => { const d = s.data() || {}, antes = !!P.salaOn[e.salaId]; P.salaOn[e.salaId] = !!d.hostOn;
      if (d.hostOn && !antes && !$('.sala')) { bipe(); toast(`${d.hostNome || 'O entrevistador'} abriu a sala da sua entrevista. Entre agora!`);
        if ('Notification' in window && Notification.permission === 'granted' && document.hidden) try { new Notification('Sua entrevista começou', { body: 'O entrevistador está na sala. Toque para entrar.' }); } catch (er) { } }
      rerender(); }, () => {}); });
}
function bannerSala(el) {
  const on = P.ents.filter(e => e.status === 'agendada' && e.tipo === 'video' && P.salaOn[e.salaId]); if (!on.length) return;
  el.insertAdjacentHTML('afterbegin', on.map(e => `<div class="acao" style="border-color:var(--ok);background:var(--ok-s)"><div style="flex:1"><b>O entrevistador está na sala</b><div class="hint">Entrevista para ${esc(e.vagaTitulo)}. A sala foi liberada para você.</div></div><button class="btn ok" data-sl2="${e.id}">Entrar agora</button></div>`).join(''));
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
}
function salaGuest(e) {
  if (!e) return; const ref = sub(EID, 'salas').doc(e.salaId), grupo = (e.entrevistadores || []).length > 1; let rec = null, un = null;
  const lado = `<h2 style="margin-bottom:6px">Entrevista para ${esc(e.vagaTitulo)}</h2><p class="hint" style="margin-top:0">${esc(P.emp.nome || '')}${grupo ? ` · ${e.entrevistadores.length} entrevistadores` : ''}</p><h3 style="margin:14px 0 6px">Dicas</h3><ul style="padding-left:18px;line-height:1.7;margin:0"><li>Fique num lugar silencioso e com luz de frente.</li><li>Use fone de ouvido, se tiver.</li><li>Deixe o celular apoiado, na altura dos olhos.</li><li>Se a imagem não aparecer em 1 minuto, use o link alternativo.</li></ul><div id="tr-av" class="hint" style="margin-top:14px"></div>`;
  const aoSair = () => { if (un) un(); if (rec) rec.parar(); };
  const s = grupo ? abrirSalaGrupo({ ref, eu: P.user.uid, nome: P.perfil.nome || 'Candidato', papel: 'candidato', titulo: `Entrevista: ${e.vagaTitulo}`, linkAlt: `https://meet.jit.si/nexum-${e.salaId}`, lado, aoSair })
    : abrirSala({ ref, papel: 'guest', titulo: `Entrevista: ${e.vagaTitulo}`, linkAlt: `https://meet.jit.si/nexum-${e.salaId}`, lado, aoSair });
  let perguntou = false; un = ref.onSnapshot(sn => { const d = sn.data() || {}; if (d.transcrever && d.consentTranscr == null && !perguntou) { perguntou = true;
      const av = document.createElement('div'); av.className = 'aviso'; av.style.cssText = 'position:absolute;left:16px;right:16px;top:56px;z-index:5;color:var(--ink)';
      av.innerHTML = `<b>O entrevistador pediu para transcrever a conversa</b><p style="margin:6px 0">O texto ajuda na avaliação e fica só com a empresa. ${temTranscricao() ? 'No Chrome, o áudio passa pelo serviço de voz do Google.' : 'Seu navegador não transcreve, mas a do entrevistador pode.'}</p><div class="row"><button class="btn ok sm" id="tr-sim">Autorizo</button><button class="btn sec sm" id="tr-nao">Não autorizo</button></div>`;
      $('.vids', s.el).appendChild(av);
      $('#tr-sim', av).onclick = async () => { av.remove(); await ref.update({ consentTranscr: agora() }).catch(() => {}); rec = iniciarTranscricao(ref, primeiro(P.perfil.nome) || 'Candidato'); $('#tr-av', s.el).textContent = 'Transcrição autorizada por você.'; };
      $('#tr-nao', av).onclick = async () => { av.remove(); await ref.update({ consentTranscr: 'negado' }).catch(() => {}); $('#tr-av', s.el).textContent = 'Você não autorizou a transcrição.'; }; } }, () => {});
}

function bannerAnon(el) { if (!ehAnonimo()) return; el.insertAdjacentHTML('afterbegin', '<div class="acao" style="border-color:var(--warn);background:var(--warn-s)"><div style="flex:1"><b>Crie uma senha</b><div class="hint">Você fez a candidatura rápida. Com a senha, você acompanha de qualquer aparelho e não perde o acesso.</div></div><button class="btn" data-cs="1">Criar senha</button></div>'); }

/* ---------- Início ---------- */
if (iniciarFirebase('rs-candidato')) {
  base();
  if (!EID) { $('#view').innerHTML = '<div class="panel empty"><b>Abra pelo link da empresa</b>Este portal é aberto pelo link de vagas divulgado pela empresa.</div>'; }
  else {
    emp(EID).get().then(s => { if (!s.exists) { $('#view').innerHTML = '<div class="panel empty"><b>Empresa não encontrada</b>Confira o link recebido.</div>'; return; } P.emp = s.data(); base(); aplicarMarca(); document.title = `Vagas · ${P.emp.nome}`;
      sub(EID, 'vagas').where('status', '==', 'aberta').onSnapshot(q => { P.vagas = docs(q); rerender(); }, er => toast(msgErro(er), true));
      auth.onAuthStateChanged(u => { if (u) aoEntrar(u); else { P.user = null; P.perfil = null; P.apps = []; P.ents = []; P.subs.forEach(f => f()); P.subs = []; if (['minhas', 'perfil'].includes(P.view)) P.view = 'vagas'; render(); } });
    }).catch(er => { $('#view').innerHTML = `<div class="panel empty"><b>Não foi possível abrir</b>${esc(msgErro(er))}</div>`; });
  }
}
</script></body></html>
