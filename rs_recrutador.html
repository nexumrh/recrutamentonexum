  const mot = {}; S.d.priv.filter(p => p.motivo).forEach(p => mot[p.motivo] = (mot[p.motivo] || 0) + 1);
  el.innerHTML = `<div class="kpis" style="margin-bottom:16px"><div class="kpi"><b>${ap.length}</b><span>candidaturas</span></div><div class="kpi"><b>${ap.filter(a => a.etapa === 'aprovado').length}</b><span>aprovados</span></div><div class="kpi"><b>${ap.length ? Math.round(ap.filter(a => a.etapa === 'aprovado').length / ap.length * 100) : 0}%</b><span>taxa de aprovação</span></div><div class="kpi"><b>${tempo != null ? tempo + ' dias' : '—'}</b><span>da inscrição à decisão</span></div></div>
    <section class="panel"><div class="panel-head"><h2 style="flex:1">Funil por vaga</h2><button class="btn sec sm" id="rl-csv">Exportar candidaturas (CSV)</button></div><div class="tbl-wrap"><table><thead><tr><th>Vaga</th>${ETAPAS.map(([, t]) => `<th class="n">${t}</th>`).join('')}</tr></thead><tbody>${S.d.vagas.map(v => { const a = ap.filter(x => x.vagaId === v.id); return `<tr><td><b>${esc(v.titulo)}</b></td>${ETAPAS.map(([k]) => `<td class="n">${a.filter(x => etapaV(x) === k).length || ''}</td>`).join('')}</tr>`; }).join('')}</tbody></table></div></section>
    <div class="cols"><section class="panel"><h2 style="margin-bottom:8px">De onde vêm os candidatos</h2>${Object.keys(orig).length ? `<table><tbody>${Object.entries(orig).sort((a, b) => b[1][0] - a[1][0]).map(([o, [n, ok]]) => `<tr><td>${esc(o)}</td><td class="n">${n}</td><td class="n hint">${ok} aprovado(s)</td></tr>`).join('')}</tbody></table>` : '<p class="hint">Sem dados.</p>'}</section>
    <section class="panel"><h2 style="margin-bottom:8px">Motivos de reprovação</h2>${Object.keys(mot).length ? `<table><tbody>${Object.entries(mot).sort((a, b) => b[1] - a[1]).map(([o, n]) => `<tr><td>${esc(o)}</td><td class="n">${n}</td></tr>`).join('')}</tbody></table>` : '<p class="hint">Sem reprovações registradas.</p>'}</section></div>`;
  $('#rl-csv', el).onclick = () => { const L = [['Candidato', 'E-mail', 'Telefone', 'Cidade', 'Vaga', 'Etapa', 'Inscrição', 'Decisão', 'Origem', 'Triagem %', 'Entrevista média']];
    ap.forEach(a => { const n = notas(a); L.push([a.perfil.nome, a.perfil.email, a.perfil.telefone, a.perfil.cidade, vagaDe(a.vagaId).titulo || a.vagaTitulo, ETAPA[etapaV(a)], fd(a.criadoEm), a.decisao ? fd(a.decisao.em) : '', a.origem || '', n.tri && n.tri.pct != null ? n.tri.pct : '', n.ent || '']); });
    const csv = '\ufeff' + L.map(r => r.map(x => `"${String(x ?? '').replace(/"/g, '""')}"`).join(';')).join('\n'), u = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })), aa = document.createElement('a'); aa.href = u; aa.download = `candidaturas_${iso()}.csv`; aa.click(); setTimeout(() => URL.revokeObjectURL(u), 1500); log('Exportou as candidaturas'); };
}
/* ---------- Equipe ---------- */
function vEquipe(el) {
  if (!ehAdmin()) { el.innerHTML = '<div class="panel empty"><b>Acesso restrito</b>Só o administrador gerencia a equipe.</div>'; return; }
  el.innerHTML = `<div class="row" style="margin-bottom:14px"><span class="hint">Recrutadores gerenciam vagas e candidatos. Avaliadores (gestores das lojas) entrevistam, avaliam e comentam, sem mexer nas etapas.</span><span class="sp"></span><button class="btn" id="eq-n">Adicionar pessoa</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Papel</th><th>Último acesso</th><th></th></tr></thead><tbody>${S.d.users.map(u => `<tr><td><b>${esc(u.nome)}</b>${u.ativo === false ? ' <span class="pill bad">desativado</span>' : ''}</td><td>${esc(u.email)}</td><td>${u.id === S.user.uid ? PAPEIS[u.role] : `<select class="inp" data-pp="${u.id}" style="width:auto">${opts(Object.entries(PAPEIS), u.role)}</select>`}</td><td class="hint">${u.ultimoAcesso ? fdt(u.ultimoAcesso) : 'nunca'}</td><td>${u.id !== S.user.uid ? `<button class="btn ghost sm" data-at="${u.id}">${u.ativo === false ? 'Reativar' : 'Desativar'}</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
  $('#eq-n', el).onclick = () => modal('Adicionar pessoa à equipe', `<div class="fld"><label for="eq-nm">Nome</label><input class="inp" id="eq-nm"></div><div class="fld"><label for="eq-e">E-mail</label><input class="inp" type="email" id="eq-e"></div><div class="fld"><label for="eq-s">Senha inicial (mínimo de 6 caracteres)</label><input class="inp" id="eq-s" value="${uid(10)}"></div><div class="fld"><label for="eq-p">Papel</label><select class="inp" id="eq-p">${opts(Object.entries(PAPEIS), 'recrutador')}</select></div><p class="hint">Passe o e-mail e a senha para a pessoa. Ela pode trocar a senha em "Esqueci minha senha".</p>`,
    { foot: '<button class="btn sec" data-close>Cancelar</button><button class="btn" id="eq-ok">Adicionar</button>', onMount: m => $('#eq-ok', m).onclick = async () => { const nm = $('#eq-nm', m).value.trim(), e = $('#eq-e', m).value.trim().toLowerCase(), s = $('#eq-s', m).value; if (nm.length < 2 || !emailOk(e)) return toast('Informe nome e e-mail válidos.', true);
      const b = $('#eq-ok', m); b.disabled = true; try { const aux = firebase.initializeApp(FIREBASE_CONFIG, 'rs-aux-' + Date.now()).auth(); await aux.setPersistence(firebase.auth.Auth.Persistence.NONE); const cr = await aux.createUserWithEmailAndPassword(e, s); const nid = cr.user.uid; await aux.signOut();
        await db.doc(`users/${nid}`).set({ eid: S.eid, role: $('#eq-p', m).value, nome: nm, email: e, ativo: true, criadoEm: agora(), por: S.me.nome }); log(`Adicionou ${nm} à equipe`); closeModal(); toast('Pessoa adicionada.'); } catch (er) { b.disabled = false; toast(msgErro(er), true); } } });
  $$('[data-pp]', el).forEach(s => s.onchange = async () => { await db.doc(`users/${s.dataset.pp}`).update({ role: s.value }); log(`Mudou o papel de ${(S.d.users.find(u => u.id === s.dataset.pp) || {}).nome} para ${PAPEIS[s.value]}`); toast('Papel atualizado.'); });
  $$('[data-at]', el).forEach(b => b.onclick = async () => { const u = S.d.users.find(x => x.id === b.dataset.at); await db.doc(`users/${u.id}`).update({ ativo: u.ativo === false }); log(`${u.ativo === false ? 'Reativou' : 'Desativou'} ${u.nome}`); });
}
/* ---------- Configurações ---------- */
function vConfig(el, aba = S.cfgAba || 'emp') {
  if (!ehAdmin()) { el.innerHTML = '<div class="panel empty"><b>Acesso restrito</b></div>'; return; } S.cfgAba = aba; const e = S.emp, ms = { ...MSGS_PADRAO, ...(e.msgs || {}) };
  el.innerHTML = `<div class="tabs">${[['emp', 'Empresa'], ['msg', 'Mensagens padrão'], ['log', 'Registro de atividades']].map(([k, t]) => `<button class="${aba === k ? 'on' : ''}" data-a="${k}">${t}</button>`).join('')}</div><div id="cf-b"></div>`;
  $$('.tabs button', el).forEach(b => b.onclick = () => vConfig(el, b.dataset.a)); const w = $('#cf-b', el);
  if (aba === 'emp') { w.innerHTML = `<section class="panel"><div class="grid"><div class="fld"><label for="ce-n">Nome da empresa</label><input class="inp" id="ce-n" value="${esc(e.nome || '')}"></div><div class="fld"><label for="ce-c">Cidade</label><input class="inp" id="ce-c" value="${esc(e.cidade || '')}"></div><div class="fld full"><label for="ce-e">Endereço para entrevistas presenciais</label><input class="inp" id="ce-e" value="${esc(e.endereco || '')}"></div>
      <div class="fld full"><label for="ce-s">Sobre a empresa (aparece no portal do candidato)</label><textarea class="inp" id="ce-s">${esc(e.sobre || '')}</textarea></div><div class="fld"><label for="ce-r">Guardar candidatos não contratados por (meses)</label><input class="inp" type="number" min="1" id="ce-r" value="${e.retencaoMeses || 12}"></div><div class="fld"><label>Portal do candidato</label><div class="row" style="flex-wrap:nowrap"><input class="inp" readonly value="${esc(linkPortal())}"><button class="btn sec" id="ce-l">Copiar</button></div></div></div><div class="row end"><button class="btn" id="ce-ok">Salvar</button></div></section>`;
    $('#ce-l', w).onclick = () => { navigator.clipboard && navigator.clipboard.writeText(linkPortal()); toast('Link copiado.'); };
    $('#ce-ok', w).onclick = async () => { await emp(S.eid).update({ nome: $('#ce-n', w).value.trim() || e.nome, cidade: $('#ce-c', w).value.trim(), endereco: $('#ce-e', w).value.trim(), sobre: $('#ce-s', w).value.trim(), retencaoMeses: Math.max(1, parseInt($('#ce-r', w).value) || 12) }); log('Atualizou os dados da empresa'); toast('Salvo.'); }; }
  else if (aba === 'msg') { const rot = { teste: 'Envio de teste', entrevista: 'Convite para entrevista', aprovado: 'Aprovação', reprovado: 'Reprovação' };
    w.innerHTML = `<section class="panel"><p class="hint" style="margin-top:0">Use {nome}, {vaga}, {prazo} e {data}. Você pode ajustar a mensagem antes de cada envio.</p>${Object.entries(rot).map(([k, t]) => `<div class="fld"><label for="cm-${k}">${t}</label><textarea class="inp" id="cm-${k}">${esc(ms[k])}</textarea></div>`).join('')}<div class="row end"><button class="btn" id="cm-ok">Salvar mensagens</button></div></section>`;
    $('#cm-ok', w).onclick = async () => { await emp(S.eid).update({ msgs: Object.fromEntries(Object.keys(rot).map(k => [k, $(`#cm-${k}`, w).value.trim() || MSGS_PADRAO[k]])) }); log('Atualizou as mensagens padrão'); toast('Mensagens salvas.'); }; }
  else w.innerHTML = `<section class="panel"><ul class="list">${S.d.log.map(x => `<li><div class="t"><div>${esc(x.t)}</div><div>${esc(x.por)} · ${fdt(x.em)}</div></div></li>`).join('') || '<li><div class="t"><div class="hint">Sem registros.</div></div></li>'}</ul></section>`;
}
/* ---------- Início ---------- */
if (iniciarFirebase('rs-recrutador')) auth.onAuthStateChanged(u => { if (S.criando) return; if (u) entrar(u); else { S.subs.forEach(f => f()); S.subs = []; S.me = null; telaLogin(S.avisoLogin); S.avisoLogin = null; } });
</script></body></html>
